<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="assets/app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>管理入口</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang TC','Noto Sans TC',sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{font-size:13px;color:#888;margin-bottom:20px}
  a.card{display:block;background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  a.card:active{background:#f0f1f3}
  /* a.card 是 display:block，會蓋過 hidden 屬性 —— 沒有這一行，訊息紀錄那張藏不住 */
  a.card[hidden]{display:none}
  .t{font-size:16px;font-weight:700}
  .d{font-size:13px;color:#888;margin-top:4px}
  /* 沒帶 mt 時的說明（不可點）：整張消失會讓人以為「改的沒生效」，看不出是缺參數 */
  div.note{background:#fbfbfc;border:1px dashed #d5d8dc;border-radius:14px;padding:16px 20px;margin-bottom:12px}
  /* ⚠️ 這行**目前是冗餘的**（2026-08-20 突變實測：拿掉它，說明卡照樣藏得住）。
     原理：`[hidden]{display:none}` 來自瀏覽器內建樣式，只會被**作者寫的 display 宣告**蓋掉。
     div.note 沒有宣告 display ⇒ 內建樣式本來就生效。
     留著是為了「日後有人給 div.note 加上 display:flex/grid」的那一刻——那時 hidden 會立刻失效。
     對照上面的 a.card[hidden]：那個是**真的在擋**（a.card 有 display:block），突變測試會抓到。 */
  div.note[hidden]{display:none}
  div.note .t{color:#999}
  code{background:#eceef0;padding:1px 5px;border-radius:4px;font-size:12px}
  /* 版本標記：用來分辨「載到新版但缺參數」與「瀏覽器拿到快取的舊版」 */
  .ver{margin-top:14px;text-align:center;font-size:11px;color:#c0c4c8;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <h1>管理入口</h1>
  <div class="sub">選擇要進入的看板</div>
  <a class="card" id="go-board" href="board.html">
    <div class="t">🗂 人事異動看板</div>
    <div class="d">新人報到核准・人事異動・員工名冊・資訊維護</div>
  </a>
  <a class="card" id="go-stats" href="stats.html">
    <div class="t">📊 活動紀錄看板</div>
    <div class="d">活動出席統計・活動管理・年資里程碑</div>
  </a>
  <a class="card" id="go-hr" href="hr-stats.html">
    <div class="t">📈 人事資訊看板</div>
    <div class="d">年資／年齡分佈・單位結構・退休預警</div>
  </a>
  <!-- 帶了 mt 顯示這張（可點）；沒帶則顯示下面那張說明，不會整個不見 -->
  <a class="card" id="go-messages" href="messages.html" hidden>
    <div class="t">✉️ 訊息紀錄</div>
    <div class="d">每一則 LINE 通知的發送紀錄・依批次摺疊</div>
  </a>
  <div class="note" id="msg-note" hidden>
    <div class="t">✉️ 訊息紀錄（這條網址少了參數）</div>
    <div class="d">要在網址最後加上 <code>&amp;mt=…</code> 才進得去。<br>
      桌面上的 <code>jdc-boards-with-message-log.html</code> 第一條就是完整網址。</div>
  </div>
  <div class="ver" id="ver">v2026-08-20a</div>
</div>
<script src="assets/board-cache.js"></script>
<script>
// 純轉傳：本頁無資料、不打後端；token 帶去的看板自己驗
var m=location.search.match(/[?&]t=([^&]+)/),t=m?m[1]:'';
// mt＝hub 的 viewer token，與 t（line-platform）是兩套權限來源，不可互換。
// 本頁是入口，順手把它轉傳下去：只要換這一個書籤，三個看板的「訊息紀錄 →」就都會出現。
var mm=location.search.match(/[?&]mt=([^&]+)/),mt=mm?mm[1]:'';
if(t){
  var q='?t='+t+(mt?'&mt='+mt:'');
  document.getElementById('go-board').href='board.html'+q;
  document.getElementById('go-stats').href='stats.html'+q;
  // hr-stats.html 還沒有訊息紀錄的 UI，帶 mt 過去也沒東西讀，所以不帶
  document.getElementById('go-hr').href='hr-stats.html?t='+t;
}
// 帶了 mt 就給可點的卡；沒帶就給說明卡。
// 兩者擇一顯示，**絕不兩張都藏**——整張消失時看不出是「改沒生效」還是「網址少參數」，
// 2026-08-20 就是卡在這一格：使用者連說兩次「我沒看到」，而兩種原因長得一模一樣。
if(mt){
  var ml=document.getElementById('go-messages');
  ml.href='messages.html?t='+mt;   // 這一頁的後端是 hub，吃的是 mt
  ml.hidden=false;
}else{
  document.getElementById('msg-note').hidden=false;
}
var GAS_URL='https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
// fetch 匿名(credentials:'omit')：JSONP script 會帶瀏覽器 Google session，帳號狀態半殘的電腦被 Google 拒絕
function jsonp(action,params,timeoutMs){
  var qs=Object.keys(params||{}).filter(function(k){return params[k]!=='';}).map(function(k){return '&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('');
  // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
  // 讓整段 init 同步當掉 → 畫面永遠停在「載入中」且不顯示任何錯誤（2026-07-31 查本頁時發現）。
  // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消（低頻看板無影響）。
  var timer, timeout=new Promise(function(_,rej){timer=setTimeout(function(){var e=new Error('timeout');e.name='AbortError';rej(e);},timeoutMs||15000);});
  return Promise.race([timeout, fetch(GAS_URL+'?action='+encodeURIComponent(action)+qs+'&callback=cb',{credentials:'omit',redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(t){var a=t.indexOf('('),b=t.lastIndexOf(')');if(a===-1||b===-1)throw new Error('bad');return JSON.parse(t.slice(a+1,b));})])
    .then(function(v){clearTimeout(timer);return v;})
    .catch(function(e){clearTimeout(timer);return {ok:false,msg:(e&&e.name==='AbortError')?'連線逾時（伺服器喚醒中），請重新整理再試。':'連線失敗，請重新整理。'};});}
// 預取種子（2026-07-25 建，2026-08-19 改寫）：停在本頁時背景先抓，點進去即秒顯。
// 原本兩支 seed 並行、且直接寫明文 sessionStorage——快取搬到加密 localStorage 之後
// 那些鍵不再有人讀（死碼），而兩支並行也違反「讀取不並行」。改成單一 batch。
// 仍刻意不預取 board.html：它帶待報到者姓名。
if(t){
  var SEED_ITEMS=[{a:'getHrStats'},{a:'getActivityStats',p:{act:''}}];
  queueRead(function(){
    return jsonp('batch',{token:t,list:JSON.stringify(SEED_ITEMS)}).then(function(env){
      if(cacheVerdict(env)!=='ok')return;
      return persistBatchSlices(t,env,SEED_ITEMS,nameOfSlice);
    });
  });
}
// iOS「加到主畫面」standalone 模式：<a> 導頁會彈出帶網址列的內嵌 Safari，
// 改用 JS 導頁就留在 App 視窗內（桌機瀏覽器行為不變）
document.querySelectorAll('a.card').forEach(function(a){
  a.addEventListener('click',function(e){e.preventDefault();location.href=this.href;});
});
</script>
</body>
</html>
