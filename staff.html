<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<title>報到掃描</title>
<script>
  // 在第一次繪製前就套用主題，否則深色使用者會先閃一下白底。預設淺色（不跟隨系統設定）。
  try { if (localStorage.getItem('evtchk_theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {}
</script>
<style>
  /* 淺色值全數沿用平台既有語言（index.html／checkin.html 同源）：主色 #06c755、
     語意四色 msg-ok/warn/err、白卡 12px 圓角、480 置中。
     深色是本頁新增的——平台原本沒有深色定義，色相沿用、只換明度，語意不變。 */
  :root{
    --bg:#f7f7f7; --card:#fff; --sub:#fafafa; --line:#eee; --line2:#ddd;
    --ink:#1a1a1a; --txt:#333; --mut:#888; --faint:#aaa;
    --ok-bg:#e6f9ee; --ok-fg:#1a7d44;
    --wa-bg:#fff4e5; --wa-fg:#8a5300;
    --er-bg:#fdecea; --er-fg:#b71c1c;
    --primary:#06c755;
    --shadow:0 1px 4px rgba(0,0,0,.08);
    --frame:rgba(255,255,255,.85);
  }
  :root[data-theme="dark"]{
    --bg:#121415; --card:#1c1f21; --sub:#191c1e; --line:#2a2e30; --line2:#3a4143;
    --ink:#f0f2f2; --txt:#d6dadb; --mut:#8f9698; --faint:#6d7476;
    --ok-bg:#102a1d; --ok-fg:#5fd48f;
    --wa-bg:#2e2210; --wa-fg:#e9b063;
    --er-bg:#2e1614; --er-fg:#f0908f;
    --primary:#06c755;
    --shadow:0 1px 4px rgba(0,0,0,.5);
    --frame:rgba(255,255,255,.75);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body{
    margin:0 auto; max-width:480px; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans TC",sans-serif;
    font-size:17px; line-height:1.6;
  }

  /* 頂列＝這台手機的身分證：6 台長得一樣，沒有它就分不出自己是哪站、連的是哪場。 */
  #bar{display:flex;align-items:center;gap:10px;padding:10px 14px;
       background:var(--card);border-bottom:1px solid var(--line)}
  #bar img{height:22px;width:auto;flex:none}
  #tbAct{font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tbStation{margin-left:auto;flex:none;font-size:13px;font-weight:700;letter-spacing:.06em;
             color:var(--ok-fg);background:var(--ok-bg);border-radius:999px;padding:4px 12px}
  #tbStation.unset{color:var(--er-fg);background:var(--er-bg)}
  #theme{flex:none;width:32px;height:32px;border-radius:999px;border:1px solid var(--line2);
         background:transparent;color:var(--mut);font-size:15px;line-height:1;cursor:pointer;padding:0}
  #theme:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* 頂部區塊（站別列＋相機）整塊釘住：捲動時只有下面的判定卡與手動報到在動。
     為何連 #bar 一起釘：站別是這台手機的身分證，捲走了就分不出自己是哪一站。
     為何包一層而不是各自 sticky：那要寫死 bar 的高度當 top 值，字級一變就錯位。 */
  #top{position:sticky;top:0;z-index:5;background:var(--bg)}

  /* 相機：對焦框是四個角括號，掃到就閃一下判定色——工作人員不必讀字就知道成不成。 */
  #view{position:relative;background:#000}
  /* 判定卡顯示中會壓暗取景畫面，讓「現在不是在掃」看得出來（見 holdUntil）。 */
  #view.hold #cam{filter:brightness(.45)}
  /* Q6：iOS 亮綠點是系統的「相機使用中」指示，跟錄影無關。講在鏡頭旁邊最省事，
     而且壓在畫面上不佔額外高度——釘住的區塊每多 16px 都是判定卡的損失。 */
  #camnote{position:absolute;left:0;right:0;bottom:5px;text-align:center;
           font-size:11px;line-height:1.4;color:rgba(255,255,255,.72);
           text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
  #cam{display:block;width:100%;height:38vh;object-fit:cover;background:#000}
  #frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
         width:min(52vw,190px);height:min(52vw,190px);pointer-events:none}
  #frame span{position:absolute;width:24px;height:24px;border:3px solid var(--frame);
              transition:border-color .18s ease}
  #frame .tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
  #frame .tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
  #frame .bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 4px}
  #frame .br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 4px 0}
  #frame.hit-ok  span{border-color:#06c755}
  #frame.hit-dup span{border-color:#f5a524}
  #frame.hit-bad span{border-color:#e5484d}
  @media (prefers-reduced-motion:reduce){ #frame span{transition:none} }

  #panel{padding:14px 16px 28px}

  /* 判定卡＝平台 msg-* 的放大版：淡色底＋深色字（不是深底白字，那個在強光下會糊）。 */
  .card{border-radius:12px;padding:16px 18px;margin-bottom:12px;
        box-shadow:var(--shadow);background:var(--card)}
  .card.ok  {background:var(--ok-bg);color:var(--ok-fg)}
  .card.dup {background:var(--wa-bg);color:var(--wa-fg)}
  .card.bad {background:var(--er-bg);color:var(--er-fg)}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em}
  .who{font-size:22px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.3}
  /* 唯一主角＝桌次。大數字＋小字「桌」，像登機口顯示器那樣一眼讀完。 */
  .seat{font-size:64px;font-weight:800;line-height:1.05;margin:6px 0 2px;
        font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .seat .u{font-size:20px;font-weight:600;margin-left:6px;letter-spacing:0}
  .seat.word{font-size:40px}
  .seat.none{font-size:20px;font-weight:700;line-height:1.4;margin:8px 0 2px}
  .unit{font-size:14px;color:var(--mut)}
  .msg{font-size:17px;line-height:1.6}
  .msg .sub{display:block;font-size:14px;margin-top:4px;opacity:.85}

  /* 待機卡：上一位已完成的訊號。**空白畫面比殘留畫面安全**——判定卡留在螢幕上時，
     操作員很容易把上一個人的桌號念給下一個人。 */
  .card.idle{background:var(--sub);color:var(--mut);text-align:center}
  .card.idle .msg{font-size:19px;font-weight:700;color:var(--mut)}
  /* 倒數條：讓「再等一下就會清掉」看得見，而不是畫面莫名其妙自己變了。 */
  #countdown{height:3px;border-radius:2px;background:currentColor;opacity:.35;
             margin-top:12px;transform-origin:left center;animation:cd linear forwards}
  @keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){ #countdown{animation:none;opacity:.15} }

  /* 掃不到時的正路：先選單位、再選姓名（與綁定頁同一種操作，現場不必打中文）。 */
  #pick .eyebrow{color:var(--mut);letter-spacing:.06em}
  #pick label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}
  #pick select{width:100%;font-size:17px;padding:12px 14px;border-radius:8px;
               border:1px solid var(--line2);background:var(--card);color:var(--txt);font-family:inherit}
  #pick select:disabled{color:var(--faint);background:var(--sub)}
  #pick select:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  /* 紅字提示放在下拉「外面」——iOS 把 select 交給系統滾輪畫，<option> 的顏色字級一律被忽略，
     所以「已報到」的紅色小字塞進選項裡在工作人員的手機上是看不到的。 */
  #pickHint{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--er-fg)}

  #foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
        font-size:12px;color:var(--faint);line-height:2}
  #foot .n{font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
  #foot .warn{color:var(--wa-fg)}
  #foot a{color:var(--mut)}
  #foot a#wipe{color:#b08080}
</style></head><body>
<div id="top">
  <div id="bar">
    <img src="assets/logo-mark.svg" alt="">
    <span id="tbAct">—</span>
    <span id="tbStation">—</span>
    <button id="theme" type="button" aria-label="切換深色模式" title="切換深色模式">☾</button>
  </div>
  <div id="view">
    <video id="cam" playsinline muted></video>
    <div id="frame"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
    <div id="camnote">相機只用來辨識 QR，不錄影、不留存</div>
  </div>
</div>
<div id="panel">
  <div id="result" class="card bad" style="display:none"></div>
  <div id="pick" class="card">
    <div class="eyebrow">掃不到？手動報到</div>
    <label for="selUnit">單位</label>
    <select id="selUnit"><option value="">── 請選擇 ──</option></select>
    <label for="selName">姓名</label>
    <select id="selName" disabled><option value="">── 請先選單位 ──</option></select>
    <p id="pickHint" hidden></p>
  </div>
  <div id="foot">
    <span id="stat"></span>
    <div id="qbadge">待送 0 筆</div>
    <div id="diag">
      <span id="snapver">名單版本：—</span>｜build <span id="buildver">v1</span>｜最後回寫 <span id="lastsync">—</span>
      ｜<a href="#" id="reload" title="跟伺服器重新抓一次參加者名單。有人臨時補回覆、或桌次重新發佈後用">重新載入名單</a>
      ｜<a href="#" id="wipe" title="把這台手機的名單與未回傳的報到全部清空，回到剛開頁的狀態">重設這台手機</a>
    </div>
  </div>
</div>
<canvas id="cv" style="display:none"></canvas>
<script src="assets/jsQR.min.js"></script>
<script src="assets/groups.js"></script>
<script src="assets/staff-scan.js"></script>
<script>
/** 同 assets/checkin-board.js 寫法：塞進 innerHTML 前先中和 & < >。 */
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var qs = new URLSearchParams(location.search);
var DEMO = qs.get('demo') === '1';
var ACT = qs.get('act') || 'zzdemo2026';
// 站別備援：後端未部署（或舊部署）時，直接從連結帶（六個連結本來就是逐站產的）。
// 出問題回報時，工作人員照著頁面唸得出「我是第 3 站」，才有辦法定位是哪一台。
var STATION_FROM_URL = qs.get('s') || '';
var state = { seen: {}, queue: [] };
var snapshot = {};   // {hash: person}
var lastText = '', lastAt = 0;

var DEMO_CODES = [   // 假快照原始碼（真機測試掃桌面那五張 QR）
  'CHK|zzdemo2026|00001|sigA', 'CHK|zzdemo2026|00002|sigB',
  'CHK|zzdemo2026|00003|sigC', 'CHK|zzdemo2026|00004|sigD', 'CHK|zzdemo2026|00005|sigE'];
var DEMO_PEOPLE = [
  { empNo:'00001', name:'測試甲', unit:'管理部',   table:'1' },
  { empNo:'00002', name:'測試乙', unit:'工務管理組', table:'2' },
  { empNo:'00003', name:'測試丙', unit:'南港玉成', table:'3' },
  { empNo:'00004', name:'測試丁', unit:'富貴莊園', table:'主桌' },
  { empNo:'00005', name:'測試戊', unit:'宸實永寧', table:'5' }];

async function buildDemoSnapshot() {
  for (var i = 0; i < DEMO_CODES.length; i++) {
    var h = await sha256Hex(DEMO_CODES[i]);
    snapshot[h] = Object.assign({ checked: false }, DEMO_PEOPLE[i]);
  }
  DEMO_PEOPLE.forEach(function (p) { nameTable[p.name] = p; });
  rebuildEmpIndex();
  ready = true;   // DEMO 模式無載入 gate：假快照建完即可掃（保留原行為）
}

var TOKEN = qs.get('t') || '';
var SNAP_KEY = 'evtchk_snap_' + ACT;
var EXPIRE_KEY = 'evtchk_exp_' + ACT;

var QKEY = 'evtchk_queue_' + ACT;
var SEEN_KEY = 'evtchk_seen_' + ACT;
var lastSyncAt = '';   // 版本診斷列用

/**
 * 已掃名單（hash 集合）改存 localStorage（2026-08-21 修）。
 *
 * 原本 state.seen 只活在記憶體裡，而快照的 person.checked 是**下載當下的凍結值**。
 * 兩者一起失憶的後果：重新整理之後再掃同一個人 → seen 是空的、checked 還是 false
 * → 判定成 ok → 畫面顯示「已受理」，看起來就像這個人剛剛才報到成功。
 * 伺服器端冪等（活動ID＋員編）擋住了資料，所以不會長出第二列——**壞的只有畫面，
 * 而畫面正是操作人員唯一的依據**。同一個動作因為 storage 有沒有活下來而給兩種答案，
 * 這件事操作人員看不到也控制不了。
 */
// 實作在 assets/staff-scan.js（seenLoad／seenSave／seenMerge），那裡測得到；這裡只綁 localStorage。
function loadSeen() { return seenLoad(localStorage, SEEN_KEY); }
function saveSeen(seen) { return seenSave(localStorage, SEEN_KEY, seen); }
state.seen = loadSeen();   // 開頁就把上次的已掃名單接回來（宣告在上面、鍵在這裡，故於此回填）
function loadQueue() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(_) { return []; } }
function saveQueue(q) { localStorage.setItem(QKEY, JSON.stringify(q)); updateQueueBadge(); }
function updateQueueBadge() {   // D4：佇列筆數長駐畫面
  var n = loadQueue().length;
  var el = document.getElementById('qbadge');
  el.innerHTML = '待送 <span class="n">' + n + '</span> 筆';
  el.className = n > 0 ? 'warn' : '';
}
function enqueue(empNo, method) {
  if (DEMO) return;   // DEMO 模式不入佇列不回寫，避免污染真活動的報到紀錄
  var q = loadQueue(); q.push({ empNo: empNo, ts: Date.now(), m: method || 'scan' });
  saveQueue(q); flush();
}

/** empNo → hash 反查索引（C2 合併 seen 用），快照替換時重建。 */
var empToHash = {};
function rebuildEmpIndex() {
  empToHash = {};
  for (var h in snapshot) empToHash[snapshot[h].empNo] = h;
}

/**
 * 桌次一律回查快照（唯一有桌次的來源）——搜名用的 nameTable 只有 {empNo,name,unit}，
 * 所以走手動報到的人若本來就在參加者名單裡（沒綁定／相機掛掉），照樣講得出桌次；
 * 真正查不到的才是臨時出席。
 */
function tableOf(empNo) {
  var h = empToHash[empNo];
  return h && snapshot[h] ? (snapshot[h].table || '') : '';
}
function seatHtml(t) {
  if (!t) return '<div class="seat none">臨時出席・請洽主辦安排</div>';
  // 純數字才拆成「大數字＋小字桌」；「主桌」這類字面桌名整串顯示
  if (/^\d+$/.test(t)) return '<div class="seat">' + esc(t) + '<span class="u">桌</span></div>';
  return '<div class="seat word">' + esc(t) + '</div>';
}
/** 三層：判定（小）→ 姓名（中）→ 第幾桌（大）→ 單位（註腳）。ok/dup/手動共用同一張臉。 */
function personCard(cls, label, p) {
  show(cls, '<div class="eyebrow">' + esc(label) + '</div>'
    + '<div class="who">' + esc(p.name) + '</div>'
    + seatHtml(tableOf(p.empNo))
    + '<div class="unit">' + esc(p.unit || '') + '</div>');
}

/** 純文字訊息（載入中／錯誤／清除完成）用同一張卡，但走 .msg 版式。 */
function note(cls, text, sub) {
  show(cls, '<div class="msg">' + esc(text)
    + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>');
}

/** 對焦框閃一下判定色：不必讀字就知道成不成，噪音大的現場特別有用。 */
function flashFrame(kind) {
  var f = document.getElementById('frame');
  if (!f) return;
  f.className = 'hit-' + kind;
  setTimeout(function () { f.className = ''; }, 700);
}

// ─── 手動報到：單位 → 姓名 兩層下拉 ─────────────────────────────────────────
// 名單＝快照參加者 ∪ 在職名冊（聯集）。只取在職名冊會漏掉「不在職但受邀」的人；
// 只取參加者會漏掉臨時出席。以 empNo 為鍵去重，參加者的資料優先（它才有桌次）。
function allPeople() {
  var byEmp = {};
  for (var h in snapshot) {
    var s = snapshot[h];
    byEmp[s.empNo] = { empNo: s.empNo, name: s.name, unit: s.unit };
  }
  for (var k in nameTable) {
    var n = nameTable[k];
    if (n && n.empNo && !byEmp[n.empNo]) byEmp[n.empNo] = { empNo: n.empNo, name: n.name, unit: n.unit };
  }
  return Object.keys(byEmp).map(function (e) { return byEmp[e]; });
}

var peopleByUnit = {};
function buildPicker() {
  peopleByUnit = {};
  allPeople().forEach(function (p) {
    var u = p.unit || '（未分單位）';
    (peopleByUnit[u] = peopleByUnit[u] || []).push(p);
  });
  var units = Object.keys(peopleByUnit).sort(function (a, b) { return a.localeCompare(b, 'zh-Hant'); });
  Object.keys(peopleByUnit).forEach(function (u) {
    peopleByUnit[u].sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'zh-Hant'); });
  });
  // 單位分「總公司／工地」兩組 optgroup＝與報到頁共用 groups.js，分類來源不分歧
  document.getElementById('selUnit').innerHTML =
    '<option value="">── 請選擇 ──</option>' + jdcGroupedOptions(units, 'unit', '');
}

/** 這個人本機已知報到過？（後端冪等仍是最終權威，這裡只影響排序與提示） */
function isCheckedIn(empNo) {
  var h = empToHash[empNo];
  return !!(h && state.seen[h]);
}

function setPickHint(text) {
  var el = document.getElementById('pickHint');
  el.textContent = text || '';
  el.hidden = !text;
}

function fillNameSelect(unit) {
  var sel = document.getElementById('selName');
  setPickHint('');
  if (!unit) {
    sel.innerHTML = '<option value="">── 請先選單位 ──</option>';
    sel.disabled = true;
    return;
  }
  var list = peopleByUnit[unit] || [];
  // 已報到的沉到最下面，收進 optgroup——現場找的幾乎都是「還沒報到」的人，
  // 讓他們佔住上方；optgroup 的標題 iOS 會畫，<option> 的樣式不會。
  var pending = [], done = [];
  list.forEach(function (p) { (isCheckedIn(p.empNo) ? done : pending).push(p); });
  function opt(p) {
    var t = tableOf(p.empNo);
    return '<option value="' + esc(p.empNo) + '">' + esc(p.name)
      + (t ? '・' + esc(t) + (/^\d+$/.test(t) ? ' 桌' : '') : '') + '</option>';
  }
  sel.innerHTML = '<option value="">── 請選擇（未報到 ' + pending.length + ' 人）──</option>'
    + pending.map(opt).join('')
    + (done.length ? '<optgroup label="已報到（' + done.length + '）">' + done.map(opt).join('') + '</optgroup>' : '');
  sel.disabled = false;
}

function resetPicker() {
  document.getElementById('selUnit').value = '';
  fillNameSelect('');   // 內含 setPickHint('')
}

// D 全套：in-flight guard＋不遞迴重試＋任何非 ok＝失敗保留佇列＋逐包成功逐包清
var flushing = false;
async function flush() {
  if (flushing) return;                 // in-flight guard：同機同時最多一個 flush
  var q = loadQueue(); if (!q.length) return;
  flushing = true;
  try {
    var packs = chunkByLen(q, 3000);    // D1：一律切包
    for (var i = 0; i < packs.length; i++) {
      try {
        var res = await jget('recordEventCheckins', {
          t: TOKEN, act: ACT, rows: JSON.stringify(packs[i]),
          n: Date.now() + '' + Math.floor(Math.random() * 1e6)   // cache-bust nonce
        }, 45000);
        if (!res || !res.ok) {            // D3：任何非 ok（lock timeout/400/逾時）＝失敗
          note('dup', '回寫未完成，' + loadQueue().length + ' 筆待送', '稍後自動重試，不必重掃');
          return;                          // 保留剩餘佇列、等下一輪；不遞迴重試
        }
        // 逐包成功→逐包從佇列移除（部分成功不重送已寫入的）
        var sent = {}; packs[i].forEach(function (r) { sent[r.empNo + '|' + r.ts] = true; });
        saveQueue(loadQueue().filter(function (r) { return !sent[r.empNo + '|' + r.ts]; }));
        lastSyncAt = new Date().toLocaleTimeString();
        document.getElementById('lastsync').textContent = lastSyncAt;
        // C2：後端回傳全場已報到員編 → 併入 seen（聯集），跨站防重延遲 ≤ 回寫週期
        state.seen = seenMerge(state.seen, res.allChecked, empToHash);
        saveSeen(state.seen);   // 別台掃的也要留在本機，否則重整後又會判成 ok
      } catch (err) {   // 網路中斷／逾時／JSON 解析失敗＝同一種失敗
        note('dup', '回寫未完成，' + loadQueue().length + ' 筆待送', '稍後自動重試，不必重掃');
        return;         // 佇列語意不變：只有成功那支才會被移除，這裡沒動過佇列
      }
    }
  } finally { flushing = false; updateQueueBadge(); }
}

// D2：15s ＋ 0–5s 隨機 jitter（每輪重算·六台去同相）；背景節流→回前景補打
function scheduleFlush() {
  setTimeout(function () { flush(); scheduleFlush(); }, 15000 + Math.random() * 5000);
}
scheduleFlush();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') flush();
});

function manualCheckin(p) {
  var h = empToHash[p.empNo];
  var alreadySeen = h && state.seen[h];   // 本機已知報到過，但後端冪等仍允許再送出
  var msg = alreadySeen
    ? p.name + ' 已報到過，仍要再送出？'
    : ('手動報到：' + p.name + '（' + (p.unit || '') + '）？');
  if (!confirm(msg)) { resetPicker(); return; }
  enqueue(p.empNo, 'manual');
  if (h) state.seen[h] = true;
  // ⚠️ 臨時出席者不在快照裡＝沒有 hash，seen 追蹤不到他（applyScan 全程以 hash 為鍵）。
  // 後果僅止於「同一位臨時出席者再手動報到一次時，不會跳已報到過的提醒」；
  // 資料端仍由後端冪等（活動ID＋員編）擋住，不會重複寫入。
  saveSeen(state.seen);   // 手動報到也算已掃，否則重整後同一人會再被判成 ok
  personCard('ok', '已受理・手動', p);
  flashFrame('ok');
  holdThenIdle();
  resetPicker();
}

function jget(action, params, timeoutMs) {
  var u = new URL('https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec');
  u.searchParams.set('action', action);
  Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
  // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
  // 讓整段初始化同步當掉 → 畫面永遠停著且不顯示任何錯誤（2026-07-31 查 attend.html 時發現，全站同型）。
  // ⚠️ 本頁是 8/28 現場掃描站，工作人員手機機齡不可控，這條相容性特別要緊。
  // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消。
  var to, timeout = new Promise(function (_, rej) {
    to = setTimeout(function () { var e = new Error('逾時'); e.name = 'AbortError'; rej(e); }, timeoutMs||30000);
  });
  return Promise.race([timeout, fetch(u, { credentials: 'omit', redirect: 'follow' })
    .then(function (r) { return r.text(); })
    .then(function (t) { return JSON.parse(t.slice(t.indexOf('(')+1, t.lastIndexOf(')'))); })])
    .then(function (v) { clearTimeout(to); return v; })
    .catch(function (e) { clearTimeout(to); throw e; });
}

var nameTable = {}, snapMeta = { version: 0, generatedAt: '' };
var ready = false;   // 快照載入 gate：未完成前掃描停用

/**
 * 快照／已掃名單改存 localStorage（2026-08-21）。
 *
 * 原本是 sessionStorage——分頁一關就沒了，於是現場每次不小心關掉視窗，
 * 137 人的名單就要重抓一次（GAS 5–7 秒，冷啟更久）。到期機制本來就有
 * （computeCheckinExpiry_＝活動日+1 天 23:59），換成 localStorage 之後
 * 它才真的派得上用場：撐過關窗、活動結束隔天自動清掉。
 */
function purgeIfExpired() {
  var exp = Number(localStorage.getItem(EXPIRE_KEY) || 0);
  if (exp && Date.now() > exp) {
    localStorage.removeItem(SNAP_KEY); localStorage.removeItem(EXPIRE_KEY);
    localStorage.removeItem(SEEN_KEY);   // 已掃名單跟著快照同生共死，別留下跨場的殘影
  }
}

/**
 * 快照到期＝活動日+1 天 23:59（容忍 yyyy/MM/dd 或 yyyy-MM-dd）；
 * 無值或解析不到→回 null，呼叫端維持現行 24h 保守值。
 */
function computeCheckinExpiry_(eventDateStr) {
  var m = String(eventDateStr || '').match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (!m) return null;
  var dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + 1, 23, 59, 0, 0);
  return isNaN(dt.getTime()) ? null : dt.getTime();
}

/**
 * 頂列＝這台手機的身分證。後端沒給（舊部署）就退回顯示活動 ID／「站別未設定」，
 * 絕不顯示 undefined——現場看到 undefined 只會讓人以為系統壞了。
 */
function setTopbar(actName, station) {
  document.getElementById('tbAct').textContent = actName || ACT;
  // 優先序：後端（與 token 綁定，最可靠）→ 網址 ?s= → 都沒有就紅字示警，
  // 讓「沒設站別」在佈署當下就被看見，而不是 8/28 出事時才發現不知道是哪台。
  var s = station || STATION_FROM_URL;
  var el = document.getElementById('tbStation');
  el.textContent = s || '站別未設定';
  el.className = s ? '' : 'unset';
}

function applySnapshotPayload(res) {
  setTopbar(res.actName, res.station);
  // E2 硬性規則：只替換快照兩張表；絕不動 state.seen 與回寫佇列（聯集非取代）
  snapshot = res.snapshot; nameTable = res.nameTable || {};
  snapMeta = { version: res.snapshotVersion, generatedAt: res.generatedAt };
  document.getElementById('snapver').textContent = '名單版本：' + snapMeta.generatedAt;
  rebuildEmpIndex();
  buildPicker();   // 名單換版＝下拉一起換（seen 與佇列不動，見上方 E2）
}

async function loadSnapshot(force) {
  purgeIfExpired();
  var cached = force ? null : localStorage.getItem(SNAP_KEY);
  if (cached) { applySnapshotPayload(JSON.parse(cached)); ready = true; return; }
  note('dup', '名單載入中，請稍候…');   // 載入 gate：未完成禁掃
  var res = await jget('getEventCheckinSnapshot', { t: TOKEN, act: ACT });
  if (!res.ok) {  // 失敗保留舊快照（若有），不清空
    note('bad', res.msg || '名單載入失敗', '請確認網路後點「重新載入名單」');
    if (!ready) return;   // 完全沒快照＝維持禁掃
    return;
  }
  applySnapshotPayload(res);
  localStorage.setItem(SNAP_KEY, JSON.stringify(res));
  // 到期＝活動日+1 天 23:59；解析不到（無 eventDate 或格式外）→維持保守 24h
  var expEpoch = computeCheckinExpiry_(res.eventDate);
  localStorage.setItem(EXPIRE_KEY, String(expEpoch || (Date.now() + 24 * 3600 * 1000)));
  ready = true;
  note('ok', '名單就緒', Object.keys(snapshot).length + ' 位參加者，可以開始掃描');
}

function show(cls, html) {
  var el = document.getElementById('result');
  el.className = 'card ' + cls; el.style.display = 'block'; el.innerHTML = html;
}

/**
 * 判定卡的停留期（2026-08-21）。
 *
 * 為何不是「按一下確認」：尖峰時多一個動作就會被跳過，而被跳過的確認機制比沒有更糟
 * ——它讓人以為有防線。改成停留固定秒數後自動回待機，操作員的節奏維持「掃→看→掃」。
 * 停留期間一併**暫停判讀**：否則下一張碼會在操作員還在讀上一個人的桌號時就被吃掉。
 */
var HOLD_MS = 3000;
var holdUntil = 0, holdTimer = null;

function holdThenIdle(ms) {
  var d = ms || HOLD_MS;
  holdUntil = Date.now() + d;
  document.getElementById('view').classList.add('hold');
  // 倒數條由這裡補上，不由 personCard 內嵌——否則走 note() 的錯誤卡就沒有條，
  // 那條路要停 5 秒，沒有指示的 5 秒會被當成當機。
  var el = document.getElementById('result');
  var bar = document.getElementById('countdown');
  if (!bar) { bar = document.createElement('div'); bar.id = 'countdown'; el.appendChild(bar); }
  bar.style.animation = 'none';
  void bar.offsetWidth;            // 強制回流，否則連掃兩張時動畫不會重新開始
  bar.style.animation = 'cd ' + d + 'ms linear forwards';
  clearTimeout(holdTimer);
  holdTimer = setTimeout(showIdle, d);
}

function showIdle() {
  holdUntil = 0;
  document.getElementById('view').classList.remove('hold');
  show('idle', '<div class="msg">請掃下一位</div>');
}

async function handle(text, t0) {
  if (!ready) { note('dup', '名單載入中，請稍候再掃'); return; }   // 載入 gate
  var p = parseChkCode(text, ACT);
  if (!p.ok) {
    note('bad', p.reason === 'wrongAct' ? '這是別場活動的碼' : '無法辨識的碼');
    flashFrame('bad');
    return;
  }
  var h = await sha256Hex(text);
  var r = applyScan(state, h, snapshot, Date.now());
  state = r.state;
  var ms = Math.round(performance.now() - t0);
  if (r.verdict.type === 'ok') {
    // 「已受理」不寫「報到成功」：跨站判重延遲 ≤ 回寫週期，全域判重由後端冪等完成
    personCard('ok', '已受理', r.verdict.person);
    flashFrame('ok');
    holdThenIdle();
    if (navigator.vibrate) navigator.vibrate(80);
    saveSeen(state.seen);   // 立刻落地：關窗／重整之後這個人仍算已報到
    enqueue(r.verdict.person.empNo, 'scan');
  } else if (r.verdict.type === 'dup') {
    // 重複掃的人多半是忘了自己第幾桌又回頭問，所以這張也要講得出桌次
    personCard('dup', '已報到過', r.verdict.person);
    flashFrame('dup');
    holdThenIdle();
  } else {
    note('bad', '查無此碼', '快照裡沒有這個人，請洽主辦人工處理');
    flashFrame('bad');
    holdThenIdle(5000);   // 錯誤要多留一會兒，操作員得有時間讀完並決定怎麼處理
  }
  // 耗時是給我們看的診斷值，不佔現場卡片的版面
  document.getElementById('stat').innerHTML =
    '這台已掃 <span class="n">' + Object.keys(state.seen).length + '</span> 人・上次 ' + ms + 'ms';
}

function loop(video, ctx, cv) {
  if (Date.now() < holdUntil) {   // 判定卡停留中＝不判讀，避免下一張碼被提早吃掉
    requestAnimationFrame(function () { loop(video, ctx, cv); });
    return;
  }
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    cv.width = video.videoWidth; cv.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    var img = ctx.getImageData(0, 0, cv.width, cv.height);
    var t0 = performance.now();
    var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data && (code.data !== lastText || Date.now() - lastAt > 2500)) {
      lastText = code.data; lastAt = Date.now();
      handle(code.data, t0);
    }
  }
  requestAnimationFrame(function () { loop(video, ctx, cv); });
}

// 主題：預設淺色，不跟隨系統（現場六台要長得一樣，才好互相對照）；選擇記在本機。
function applyTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('theme');
  b.textContent = t === 'dark' ? '☀' : '☾';
  b.setAttribute('aria-label', t === 'dark' ? '切換淺色模式' : '切換深色模式');
  b.setAttribute('title', b.getAttribute('aria-label'));
}
document.getElementById('theme').addEventListener('click', function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('evtchk_theme', next); } catch (e) {}
  applyTheme(next);
});
try { applyTheme(localStorage.getItem('evtchk_theme') === 'dark' ? 'dark' : 'light'); } catch (e) { applyTheme('light'); }

(async function init() {
  updateQueueBadge();   // 佇列筆數不依賴 empToHash：開頁立刻反映上次 session 遺留的真實筆數，不等第一輪排程
  if (DEMO) {
    setTopbar('示範模式（不寫入）', '測試站');
    await buildDemoSnapshot();
    buildPicker();
    updateQueueBadge();   // demo 快照建完後保險再確認一次（buildDemoSnapshot 不動佇列）
  } else {
    await loadSnapshot();
    flush();   // 此時 empToHash 已由 applySnapshotPayload→rebuildEmpIndex 建好，立即補打一次殘留佇列
  }
  document.getElementById('selUnit').addEventListener('change', function () {
    fillNameSelect(this.value);
  });
  document.getElementById('selName').addEventListener('change', function () {
    var emp = this.value;
    if (!emp) { setPickHint(''); return; }
    var list = peopleByUnit[document.getElementById('selUnit').value] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].empNo === emp) {
        // 順序要緊：manualCheckin 內部會 resetPicker()，而它會清掉提示行，
        // 所以「先前是否已報到」要先記下來，等重設完再把紅字寫回去。
        var was = isCheckedIn(emp), nm = list[i].name;
        manualCheckin(list[i]);
        setPickHint(was ? '⚠ ' + nm + ' 先前已報到過' : '');
        return;
      }
    }
  });
  document.getElementById('reload').addEventListener('click', function (e) {
    e.preventDefault();
    if (!confirm('重新載入名單？（僅更新名單版本，不影響已掃紀錄與待送佇列）')) return;
    loadSnapshot(true);
  });
  document.getElementById('wipe').addEventListener('click', function (e) {
    e.preventDefault();
    // 待送佇列只存在這台手機上，清掉就是報到紀錄真的不見——把筆數講出來，別讓人盲按
    var n = loadQueue().length;
    var msg = n > 0
      ? '⚠️ 尚有 ' + n + ' 筆報到還沒回寫到伺服器。\n\n清除後這 ' + n + ' 筆會永久消失、無法復原。\n\n仍要清除？'
      : '清除本機快照？（目前 0 筆待送，不會遺失任何報到紀錄）';
    if (!confirm(msg)) return;
    localStorage.removeItem(SNAP_KEY); localStorage.removeItem(EXPIRE_KEY);
    localStorage.removeItem(QKEY); localStorage.removeItem(SEEN_KEY);
    note('bad', '已清除', '請重新整理這一頁');
  });
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    var video = document.getElementById('cam');
    video.srcObject = stream; await video.play();
    var cv = document.getElementById('cv');
    loop(video, cv.getContext('2d', { willReadFrequently: true }), cv);
  } catch (err) {
    note('bad', '相機無法啟動（' + err.name + '）', '請確認瀏覽器相機權限，或用下方單位／姓名手動報到');
  }
})();
</script></body></html>
