<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<title>人事資訊看板</title>
<style>
  /* 設計語彙沿用 messages.html（LINE 訊息紀錄，2026-08-23 使用者拍板）：
     灰底細線、卡片無陰影、3px 圓角、文字三階 --ink/--ink2/--ink3。
     圖表色另算（見下方 JS 色票註解）：徽章可以淡到彩度 0.05，色塊不行。 */
  :root {
    --g: #4a7c62; --g-bg: #eff4f1;
    --ink: #2c2c2b; --ink2: #6b6b68; --ink3: #9a9a96;
    --bg: #fbfbfa; --ln: #ececea;
    --warn: #8a6a2f; --warn-bg: #f7f2e6;
    --r-dim: #8f3040; --r-bg: #fbeef1;
    --b: #2f4858;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans TC",sans-serif;
    margin:0 auto;padding:20px 16px 48px;max-width:760px;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased}
  .brand{text-align:center;margin:0 0 14px}.brand img{width:100%;max-width:240px;height:auto}
  h1{font-size:19px;font-weight:600;margin:0 0 2px;letter-spacing:.01em}
  .sub{font-size:13px;color:var(--ink3);margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--ln);border-radius:3px;padding:16px 18px;margin-bottom:10px}
  .sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
  .sec-h b{font-size:15px;font-weight:600;white-space:nowrap}
  .sec-h small{line-height:1.45}
  .sec-h small{color:var(--ink3);font-size:12px}
  /* KPI row */
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .kpi{flex:1 1 30%;background:#fff;border:1px solid var(--ln);border-radius:3px;padding:14px 16px;text-align:center}
  .kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
  .kpi .k{font-size:12px;color:var(--ink3)}
  /* 直方圖（縱向柱）。柱色刻意取深階（L≈0.50）——灰底上淡色柱子會消失，
     這是「低調但要看得清」的補償：彩度不拉高，靠明度差拉開。 */
  .cols{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:6px;position:relative}
  .cols .ol{position:absolute;left:0;right:0;top:16px;width:100%;pointer-events:none;overflow:visible}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .col .bar{width:100%;max-width:46px;background:#346b84;border-radius:3px 3px 0 0;min-height:2px}
  .col .n{font-size:12px;line-height:16px;height:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .col .lb{font-size:10.5px;line-height:18px;height:18px;color:var(--ink3);white-space:nowrap}
  /* 橫條 */
  .hrow{display:flex;align-items:center;gap:8px;margin:5px 0}
  .hrow .nm{flex:0 0 88px;font-size:13px;text-align:right;color:var(--ink);white-space:nowrap;overflow:hidden}
  .hrow .trk{flex:1;display:flex;gap:2px;align-items:center}
  .hrow .seg{height:14px;border-radius:0}
  .hrow .seg:first-child{border-radius:3px 0 0 3px}
  .hrow .seg:last-child{border-radius:0 3px 3px 0}
  .hrow .seg.only{border-radius:3px}
  .hrow .cnt{font-size:12px;color:var(--ink3);margin-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* 人口金字塔 */
  .pyr{display:flex;flex-direction:column;gap:4px}
  .prow2{display:flex;align-items:center;gap:6px}
  .prow2 .mid{flex:0 0 52px;text-align:center;font-size:11px;color:var(--ink3);white-space:nowrap}
  .prow2 .side{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
  .prow2 .side.l{justify-content:flex-end}
  .prow2 .side i{display:block;height:14px;border-radius:2px;flex:none}
  .prow2 .side.l i{border-radius:2px 0 0 2px}.prow2 .side.r i{border-radius:0 2px 2px 0}
  .prow2 .side .v{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none;min-width:14px}
  .prow2 .side.l .v{text-align:right}
  /* 樹狀圖 */
  .tm{display:flex;flex-direction:column;gap:2px}
  .tmr{display:flex;gap:2px;min-height:0}
  .tmc{position:relative;min-width:0;overflow:hidden;border-radius:2px;color:#fff;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between}
  .tmc .nm{font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}
  .tmc .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  /* 熱力圖 */
  .hmwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hm{border-collapse:separate;border-spacing:2px;font-size:12px;font-variant-numeric:tabular-nums;width:100%}
  .hm th{font-weight:500;color:var(--ink3);font-size:10.5px;padding:0 2px 2px;white-space:nowrap;text-align:center}
  .hm th.u,.hm td.u{text-align:right;white-space:nowrap;padding-right:6px;color:var(--ink);font-size:12.5px}
  .hm td{text-align:center;padding:5px 2px;border-radius:2px;min-width:30px;color:var(--ink)}
  .hm td.n{text-align:left;white-space:nowrap;color:var(--ink3);font-size:11.5px;padding-left:6px}
  /* 100% 比例條 */
  .trk.prop{max-width:100%}
  .trk.prop .seg{height:16px;font-size:10px;line-height:16px;text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
  /* 點圖 */
  .dtrk{flex:1;position:relative;height:18px;background:linear-gradient(var(--ln),var(--ln)) center/100% 1px no-repeat}
  .dtrk i{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  .hrow .cnt u{text-decoration:none;color:var(--ink3);font-size:11px}
  /* 棒棒糖（⑨）：細桿＋頂端圓點，圓點用 ::after 畫在桿頂 */
  .col .stem{position:relative;width:2px;background:currentColor;min-height:2px;border-radius:1px}
  .col .stem::after{content:'';position:absolute;left:50%;top:0;width:9px;height:9px;margin:-4px 0 0 -4.5px;border-radius:50%;background:currentColor;border:1.5px solid #fff;box-sizing:border-box}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 10px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .legend i.ln{width:14px;height:2px;border-radius:1px;vertical-align:3px}
  details.tbl{margin-top:8px}
  details.tbl summary{font-size:12px;color:var(--ink3);cursor:pointer}
  details.tbl table{border-collapse:collapse;font-size:12px;margin-top:6px;width:100%;font-variant-numeric:tabular-nums}
  details.tbl th,details.tbl td{border:1px solid var(--ln);padding:3px 8px;text-align:right}
  details.tbl th:first-child,details.tbl td:first-child{text-align:left}
  .names{font-size:12.5px;color:var(--ink);margin:2px 0 8px}
  .names b{font-weight:600}
  .empty{text-align:center;color:var(--ink3);padding:40px 0}
  .foot{font-size:11.5px;color:var(--ink3);margin-top:6px}
</style>
</head>
<body>
<div class="brand"><img src="assets/logo-full.svg" alt="日商日本國土開發股份有限公司台灣分公司"></div>
<h1>人事資訊看板</h1>
<div class="sub" id="sub">載入中…</div>
<div id="main"></div>
<script src="assets/deny-no-role.js"></script>
<script src="assets/board-cache.js"></script>
<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):'';}
// fetch 匿名(credentials:'omit')：JSONP script 會帶瀏覽器 Google session，帳號狀態半殘的電腦被 Google 拒絕（2026-07-24 verify 實證後全站換）
function jsonp(action,params){
  var qs=Object.keys(params||{}).map(function(k){return '&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('');
  // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
  // 讓整段初始化同步當掉 → 畫面永遠停在「載入中」且不顯示任何錯誤（2026-07-31 查 attend.html 時發現，全站同型）。
  // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消（低頻看板無影響）。
  var timer, timeout=new Promise(function(_,rej){timer=setTimeout(function(){var e=new Error('timeout');e.name='AbortError';rej(e);},30000);});
  return Promise.race([timeout, fetch(GAS_URL+'?action='+encodeURIComponent(action)+qs+'&callback=cb',{credentials:'omit',redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(t){var a=t.indexOf('('),b=t.lastIndexOf(')');if(a===-1||b===-1)throw new Error('bad');return denyNoRole(JSON.parse(t.slice(a+1,b)));})])
    .then(function(v){clearTimeout(timer);return v;})
    .catch(function(e){clearTimeout(timer);return {ok:false,msg:(e&&e.name==='AbortError')?'連線逾時，請重新整理。':'連線失敗'};});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 色票（2026-08-23 改低調版，與 messages.html 同語彙）。
// 分類二色：OKLCH L.50 C.105、色相 230／65，dataviz validate_palette 五項 PASS
//   （彩度下限 0.10 是驗證器硬門檻——messages.html 徽章的 0.05 在色塊上會讀成灰）。
// 序列段＝同一色相（230）只動明度 L .78→.38，每階差 0.10；不是彩虹。
// 紅只留給退休預警（訊息紀錄表的規則：紅＝例外與注意）。
// 2026-08-23 第二版（使用者：「顏色可以多幾個，但低調點」）：
//   一個主題一個色相、彩度全壓到 0.06–0.08（OKLCH）：年資＝藍灰 230、年齡＝紫灰 300、
//   入社＝青灰 180、退休＝紅褐 12（紅仍只給退休）。總公司／工地＝230／65。
//   ⚠️ 彩度 0.08 低於 validate_palette 的 0.10 門檻（會報「讀起來像灰」），刻意為之：
//   CVD 分離 ΔE 13.2、正常視覺 15.9 都 PASS，靠圖例＋每柱數字當第二編碼。
var C_HQ='#236682', C_SITE='#7d5329';
var RAMP4=['#84b3ca','#608da4','#3d6a7f','#1a485c'];                  // 年資段（藍灰）
var RAMP5=['#b7a9d2','#988ab2','#7a6d93','#5d5075','#423658'];        // 年齡段（紫灰）
var C_RET=['#763640','#a8636c','#dd939c'];                             // 已滿65 / 5年內 / 10年內
// 柱狀圖「數值越大越深」的四階，依主題換色相。最淺階從 L.64 起（不用 L.78）——
// ⑥ 入社趨勢一年只有 1～3 人的柱子會落在最淺階，白卡上 L.78 幾乎看不見（對照圖抓到）。
var SHADE={tenure:['#5e94af','#437993','#285f78','#0c4960'],
           age:['#9283b1','#786895','#5e4f79','#483962'],
           join:['#599a8e','#3e7f73','#216559','#004e44'],
           retire:['#b7787f','#9a5d65','#7e444c','#662e37']};
// 直方圖依值深淺（越多越深＝量感一眼可比）
function shade(v,max,R){R=R||SHADE.tenure;
  return R[Math.min(R.length-1,Math.floor(v/Math.max(max,1)*(R.length-0.01)))];}

/** 柱狀圖，可疊折線比較（2026-08-23 使用者：「有些圖可以再加資訊，用折線來比較」）。
 *  opts.ramp  ＝柱子深淺的色相（SHADE.*）
 *  opts.lines ＝[{label, values[], color}]，與柱子**共用同一條 y 軸**（人數）——
 *               不做雙軸；線的最大值若超過柱子，軸就跟著放大，柱子變矮是正確的後果。
 *  幾何：.n 固定 16px、.lb 固定 18px，柱區＝150-34＝116px；折線 SVG 絕對定位在柱區上，
 *  x 用百分比（第 i 根柱的中心＝(i+.5)/n），y 用 px，所以不必知道容器實際寬度。 */
function colChart(bins,opts){
  opts=opts||{}; var lines=opts.lines||[], ramp=opts.ramp;
  var H=116, BAR=112;
  var allv=bins.counts.concat([1]); lines.forEach(function(l){allv=allv.concat(l.values);});
  var max=Math.max.apply(null,allv), n=bins.labels.length;
  var html='<div class="cols">'+bins.labels.map(function(lb,i){
    var h=Math.round(bins.counts[i]/max*BAR), c=shade(bins.counts[i],max,ramp);
    return '<div class="col"><div class="n">'+bins.counts[i]+'</div>'
      +(opts.lollipop
        ? '<div class="stem" style="height:'+h+'px;color:'+c+'" title="'+esc(lb)+'：'+bins.counts[i]+' 人"></div>'
        : '<div class="bar" style="height:'+h+'px;background:'+c+'" title="'+esc(lb)+'：'+bins.counts[i]+' 人"></div>')
      +'<div class="lb">'+esc(lb)+'</div></div>';
  }).join('');
  if(lines.length){
    html+='<svg class="ol" height="'+H+'" aria-hidden="true">'+lines.map(function(l){
      var pts=l.values.map(function(v,i){return [((i+.5)/n*100).toFixed(2)+'%',(H-v/max*BAR).toFixed(1)];});
      var seg='';
      for(var i=1;i<pts.length;i++) seg+='<line x1="'+pts[i-1][0]+'" y1="'+pts[i-1][1]+'" x2="'+pts[i][0]+'" y2="'+pts[i][1]+'" stroke="'+l.color+'" stroke-width="2" stroke-linecap="round"/>';
      var dots=pts.map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="'+l.color+'" stroke="#fff" stroke-width="1.5"/>';}).join('');
      // 末端只標一個值（選擇性直接標示，不每點都標）；疊在柱子數字上方時往上讓 4px
      var e=pts[pts.length-1], last=l.values[l.values.length-1];
      var tag=l.endLabel?'<text x="'+e[0]+'" y="'+(parseFloat(e[1])-7)+'" font-size="11" fill="'+l.color+'" text-anchor="end" font-weight="600">'+esc(String(last))+'</text>':'';
      return seg+dots+tag;
    }).join('')+'</svg>';
  }
  html+='</div>';
  if(lines.length) html=legend(lines.map(function(l){return l.label;}),lines.map(function(l){return l.color;}),true)+html;
  return html;
}
/** agePairs（[年齡, 年資, 群組]）依 ① ② 的分段切桶，給「總公司 vs 工地」折線用。
 *  只涵蓋同時有生日與入社日的人，所以線的合計可能略小於柱子——小標有講。 */
function pairBins(pairs,idx,edges,group){
  var out=edges.map(function(){return 0;});
  pairs.forEach(function(p){ if(p[2]!==group) return; var v=p[idx];
    for(var i=0;i<edges.length;i++){ if(v<edges[i]){out[i]++;return;} } out[edges.length-1]++; });
  return out;
}
var TENURE_EDGES=[1,3,5,10,15,20,Infinity], AGE_EDGES=[25,30,35,40,45,50,55,60,Infinity];
function stackRows(order,units,key,ramp,segLabels,maxCount,noteFn){
  return order.map(function(nm){
    var u=units[nm], segs=u[key], total=u.count;
    var w=Math.max(total/maxCount*100,2);
    var inner=segs.map(function(c,i){
      if(!c)return '';
      return '<div class="seg'+(segs.filter(Boolean).length===1?' only':'')+'" style="flex:'+c+';background:'+ramp[i]+'" title="'+esc(nm)+'・'+esc(segLabels[i])+'：'+c+' 人"></div>';
    }).join('');
    return '<div class="hrow"><div class="nm">'+esc(nm)+'</div>'
      +'<div class="trk" style="max-width:'+w+'%">'+inner+'</div><div class="cnt">'+(noteFn?noteFn(u):total)+'</div></div>';
  }).join('');
}
/* ═══ 圖形變化（2026-08-23 使用者：「好多長條圖，可以變化不同圖面嗎」）
   每種資料一種形式，形式跟著資料的工作走（dataviz choosing-a-form）：
   ① 分佈＝柱　② 兩群對比分佈＝人口金字塔　③ 組成＝樹狀圖（面積）
   ④⑤ 單位×分段＝熱力圖　⑥ 時間序列＝面積圖　⑧ 組成比例＝100% 條
   ⑨ 逐年＋累計＝棒棒糖＋線　⑩ 單一比率排名＝點圖 */

/** 人口金字塔：左＝總公司、右＝工地，同一條尺（最大值共用），中間放年齡段。 */
function pyramid(labels,left,right,cl,cr){
  var max=Math.max.apply(null,left.concat(right,[1]));
  return '<div class="pyr">'+labels.map(function(lb,i){
    var wl=left[i]/max*100, wr=right[i]/max*100;
    return '<div class="prow2">'
      +'<div class="side l"><span class="v">'+(left[i]||'')+'</span><i style="width:'+wl.toFixed(1)+'%;background:'+cl+'"></i></div>'
      +'<div class="mid">'+esc(lb)+'</div>'
      +'<div class="side r"><i style="width:'+wr.toFixed(1)+'%;background:'+cr+'"></i><span class="v">'+(right[i]||'')+'</span></div>'
      +'</div>';
  }).join('')+'</div>';
}
/** 樹狀圖（面積＝人數）。切法：人數降冪，逐列塞到該列面積 ≥ 總面積/列數為止；
 *  列高∝列總和、列內寬∝人數。不是真正的 squarified，但 16 個單位夠用，而且零相依。 */
function treemap(items,total,height){
  var rowsN=Math.max(2,Math.round(Math.sqrt(items.length/2))), target=total/rowsN, rows=[], cur=[], sum=0;
  items.forEach(function(it){ cur.push(it); sum+=it.v; if(sum>=target&&rows.length<rowsN-1){rows.push({items:cur,sum:sum});cur=[];sum=0;} });
  if(cur.length) rows.push({items:cur,sum:sum});
  return '<div class="tm" style="height:'+height+'px">'+rows.map(function(r){
    return '<div class="tmr" style="flex:'+r.sum+'">'+r.items.map(function(it){
      var big=it.v/total>0.045;
      return '<div class="tmc" style="flex:'+it.v+';background:'+it.c+'" title="'+esc(it.nm)+'：'+it.v+' 人">'
        +'<span class="nm">'+esc(it.nm)+'</span>'+(big?'<span class="v">'+it.v+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }).join('')+'</div>';
}
/** 熱力圖：列＝單位、欄＝分段；格內印人數，底色深淺＝該格占該單位的比例（列內相對，
 *  所以 2 人的小單位與 18 人的大單位都看得出「重心在哪一段」）。 */
function heatmap(order,units,key,segLabels,ramp,noteFn){
  var head='<tr><th class="u">單位</th>'+segLabels.map(function(l){return '<th>'+esc(l)+'</th>';}).join('')+'<th class="n"></th></tr>';
  var rows=order.map(function(nm){
    var u=units[nm], segs=u[key];
    return '<tr><td class="u">'+esc(nm)+'</td>'+segs.map(function(c,i){
      if(!c) return '<td></td>';
      var share=c/u.count, k=Math.min(ramp.length-1,Math.floor(share*ramp.length)), dark=k>=ramp.length-2;
      return '<td style="background:'+ramp[k]+(dark?';color:#fff':'')+'" title="'+esc(nm)+'・'+esc(segLabels[i])+'：'+c+' 人（'+Math.round(share*100)+'%）">'+c+'</td>';
    }).join('')+'<td class="n">'+(noteFn?noteFn(u):u.count)+'</td></tr>';
  }).join('');
  return '<div class="hmwrap"><table class="hm">'+head+rows+'</table></div>';
}
/** 面積圖（時間序列）。SVG 用 viewBox，寬＝每年 30 單位，放進可橫滑容器。
 *  只標最高的三個峰值，不在每點印數字。 */
function areaChart(labels,values,color,fill){
  var n=values.length, W=Math.max(n*22,320), H=150, PX=14, PT=22, PB=22, every=n>14?2:1, max=Math.max.apply(null,values.concat([1]));
  var x=function(i){return PX+i/(n-1)*(W-2*PX);}, y=function(v){return PT+(1-v/max)*(H-PT-PB);};
  var pts=values.map(function(v,i){return x(i).toFixed(1)+','+y(v).toFixed(1);});
  var top=values.map(function(v,i){return [v,i];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3).map(function(p){return p[1];});
  var svg='<path d="M'+pts[0]+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+y(0)+' L'+x(0).toFixed(1)+','+y(0)+' Z" fill="'+fill+'"/>'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'
    +'<line x1="'+PX+'" y1="'+y(0)+'" x2="'+(W-PX)+'" y2="'+y(0)+'" stroke="#ececea"/>';
  values.forEach(function(v,i){
    svg+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(top.indexOf(i)>=0?3.5:2)+'" fill="'+color+'" stroke="#fff" stroke-width="1.5"><title>'+esc(labels[i])+'：'+v+' 人</title></circle>';
    if(top.indexOf(i)>=0) svg+='<text x="'+x(i).toFixed(1)+'" y="'+(y(v)-8).toFixed(1)+'" font-size="11" font-weight="600" fill="#2c2c2b" text-anchor="'+(i===n-1?'end':i===0?'start':'middle')+'">'+v+'</text>';
    if((n-1-i)%every===0) svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="#9a9a96" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  // 寬度貼合容器（viewBox 等比縮放）；容器比 W 窄時才出現橫向捲動
  return '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;height:auto;display:block">'+svg+'</svg></div>';
}
/** 100% 比例條：每列等長，段寬＝占比；≥15% 的段印百分比。看的是結構不是規模——規模在右側數字。 */
function propRows(order,units,key,ramp,segLabels){
  return order.map(function(nm){
    var u=units[nm], segs=u[key];
    return '<div class="hrow"><div class="nm">'+esc(nm)+'</div><div class="trk prop">'+segs.map(function(c,i){
      if(!c) return ''; var pct=c/u.count;
      return '<div class="seg" style="flex:'+c+';background:'+ramp[i]+(i>=ramp.length-2?';color:#fff':'')+'" title="'+esc(nm)+'・'+esc(segLabels[i])+'：'+c+' 人（'+Math.round(pct*100)+'%）">'+(pct>=0.15?Math.round(pct*100)+'%':'')+'</div>';
    }).join('')+'</div><div class="cnt">'+u.count+' 人</div></div>';
  }).join('');
}
/** 點圖：一列一個單位，點落在比率位置；淡線是 0→最大值的軌道。 */
function dotRows(rows,maxR,color){
  return rows.map(function(x){
    var pct=Math.round(x.rate*100), left=(x.rate/maxR*100).toFixed(1);
    return '<div class="hrow"><div class="nm">'+esc(x.nm)+'</div>'
      +'<div class="dtrk"><i style="left:'+left+'%;background:'+color+'"></i></div>'
      +'<div class="cnt">'+pct+'%<u>（'+x.hit+'/'+x.count+'）</u></div></div>';
  }).join('');
}
function legend(labels,colors,asLine){
  return '<div class="legend">'+labels.map(function(lb,i){return '<span><i class="'+(asLine?'ln':'')+'" style="background:'+colors[i]+'"></i>'+esc(lb)+'</span>';}).join('')+'</div>';
}
function numTable(order,units,key,segLabels){
  var head='<tr><th>單位</th>'+segLabels.map(function(l){return '<th>'+esc(l)+'</th>';}).join('')+'<th>計</th></tr>';
  var rows=order.map(function(nm){
    var u=units[nm];
    return '<tr><td>'+esc(nm)+'</td>'+u[key].map(function(c){return '<td>'+(c||'')+'</td>';}).join('')+'<td>'+u.count+'</td></tr>';
  }).join('');
  return '<details class="tbl"><summary>數字表</summary><table>'+head+rows+'</table></details>';
}

function renderHr(r){
  var main=document.getElementById('main');
  if(!r||!r.ok){document.getElementById('sub').textContent='';main.innerHTML='<div class="empty">'+esc((r&&r.msg)||'載入失敗')+'</div>';return;}
  var s=r.stats;
  document.getElementById('sub').textContent='資料來源：員工名冊即時快照（在職 '+s.total+' 人）';
  var maxCount=Math.max.apply(null,s.unitOrder.map(function(n){return s.units[n].count;}).concat([1]));
  var byCount=s.unitOrder.slice().sort(function(a,b){return s.units[b].count-s.units[a].count;});

  var html='';
  // KPI
  html+='<div class="kpis"><div class="kpi"><div class="v">'+s.total+'</div><div class="k">在職人數</div></div>'
      +'<div class="kpi"><div class="v">'+s.avgTenure+'</div><div class="k">平均年資（年）</div></div>'
      +'<div class="kpi"><div class="v">'+s.avgAge+'</div><div class="k">平均年齡（歲）</div></div></div>';
  // 1 年資分佈
  html+='<div class="card"><div class="sec-h"><b>① 全公司年資分佈</b><small>柱＝全公司；線＝總公司／工地各自人數（只含有入社日者）</small></div>'
      +colChart(s.tenureBins,{ramp:SHADE.tenure,lines:s.agePairs&&s.agePairs.length?[
        {label:'總公司',values:pairBins(s.agePairs,1,TENURE_EDGES,'總公司'),color:C_HQ},
        {label:'工地',values:pairBins(s.agePairs,1,TENURE_EDGES,'工地'),color:C_SITE}]:[]})
      +(s.noJoin?'<div class="foot">※ '+s.noJoin+' 人無入社日未計入</div>':'')+'</div>';
  // 2 年齡分佈：人口金字塔（左總公司、右工地），由年長到年輕
  var hqAge=s.agePairs&&s.agePairs.length?pairBins(s.agePairs,0,AGE_EDGES,'總公司'):null;
  html+='<div class="card"><div class="sec-h"><b>② 全公司年齡分佈</b><small>左＝總公司、右＝工地（只含有生日者）；同一把尺</small></div>'
      +legend(['總公司','工地'],[C_HQ,C_SITE])
      +(hqAge?pyramid(s.ageBins.labels.slice().reverse(),hqAge.slice().reverse(),pairBins(s.agePairs,0,AGE_EDGES,'工地').reverse(),C_HQ,C_SITE)
             :colChart(s.ageBins,{ramp:SHADE.age}))
      +(s.noBirth?'<div class="foot">※ '+s.noBirth+' 人無生日未計入</div>':'')+'</div>';
  // 3 各單位人數：樹狀圖（面積＝人數）
  var hqN=s.unitOrder.filter(function(n){return s.units[n].group==='總公司';}).reduce(function(a,n){return a+s.units[n].count;},0);
  html+='<div class="card"><div class="sec-h"><b>③ 各單位人數</b><small>面積＝人數；總公司 '+hqN+' 人、工地 '+(s.total-hqN)+' 人</small></div>'
      +legend(['總公司','工地'],[C_HQ,C_SITE])
      +treemap(byCount.map(function(nm){var u=s.units[nm];return {nm:nm,v:u.count,c:u.group==='總公司'?C_HQ:C_SITE};}),s.total,260)+'</div>';
  // 4 單位×年資（主題排序：平均年資高→低）
  var byTenure=s.unitOrder.slice().sort(function(a,b){return s.units[b].avgTenure-s.units[a].avgTenure;});
  html+='<div class="card"><div class="sec-h"><b>④ 各單位年資結構</b><small>依平均年資排序（資深→資淺）；格＝人數、色越深＝占該單位比例越高</small></div>'
      +heatmap(byTenure,s.units,'tenure',s.tenureSegLabels,RAMP4.slice(0,4),function(u){return '均 '+u.avgTenure+' 年・'+u.count+' 人';})+'</div>';
  // 5 單位×年齡（主題排序：平均年齡高→低）
  var byAge=s.unitOrder.slice().sort(function(a,b){return s.units[b].avgAge-s.units[a].avgAge;});
  html+='<div class="card"><div class="sec-h"><b>⑤ 各單位年齡結構</b><small>依平均年齡排序（年長→年輕）；格＝人數、色越深＝占該單位比例越高</small></div>'
      +heatmap(byAge,s.units,'age',s.ageSegLabels,RAMP5,function(u){return '均 '+u.avgAge+' 歲・'+u.count+' 人';})+'</div>';
  // 6 入社年度趨勢（時間軸·手機圖內滑動）
  var jys=Object.keys(s.joinYears).map(Number).sort(function(a,b){return a-b;});
  if(jys.length){
    var y0=jys[0],y1=jys[jys.length-1],trend={labels:[],counts:[]};
    for(var y=y0;y<=y1;y++){trend.labels.push(String(y).slice(2));trend.counts.push(s.joinYears[y]||0);}
    html+='<div class="card"><div class="sec-h"><b>⑥ 入社年度趨勢</b><small>每年新進人數（現仍在職者）；標出最高三年</small></div>'
        +areaChart(trend.labels,trend.counts,'#2e7065','#e6efec')+'</div>';
  }
  // 7 單位健康矩陣：一點=一個單位（x=平均年齡 y=平均年資 大小=人數）；虛線=全公司平均、右上淡紅=雙高
  (function(){
    var W=640,H=320,PX=42,PY=24;
    var ax=s.unitOrder.map(function(n){return s.units[n].avgAge;});
    var aMin=Math.floor(Math.min.apply(null,ax))-2, aMax=Math.ceil(Math.max.apply(null,ax))+2;
    var tMax=Math.ceil(Math.max.apply(null,s.unitOrder.map(function(n){return s.units[n].avgTenure;})))+2;
    var xs=function(a){return PX+(a-aMin)/(aMax-aMin)*(W-PX-16);};
    var ys=function(t){return H-PY-(t/tMax)*(H-PY-16);};
    var svg='<rect x="'+xs(s.avgAge)+'" y="14" width="'+(W-16-xs(s.avgAge))+'" height="'+(ys(s.avgTenure)-14)+'" fill="#8f3040" opacity="0.05"/>';
    for(var a=Math.ceil(aMin/5)*5;a<aMax;a+=5) svg+='<line x1="'+xs(a)+'" y1="'+(H-PY)+'" x2="'+xs(a)+'" y2="12" stroke="#ececea"/><text x="'+xs(a)+'" y="'+(H-6)+'" font-size="10" fill="#9a9a96" text-anchor="middle">'+a+'歲</text>';
    for(var t=2;t<tMax;t+=2) svg+='<line x1="'+PX+'" y1="'+ys(t)+'" x2="'+(W-16)+'" y2="'+ys(t)+'" stroke="#ececea"/><text x="'+(PX-4)+'" y="'+(ys(t)+3)+'" font-size="10" fill="#9a9a96" text-anchor="end">'+t+'年</text>';
    svg+='<line x1="'+xs(s.avgAge)+'" y1="12" x2="'+xs(s.avgAge)+'" y2="'+(H-PY)+'" stroke="#8f3040" stroke-dasharray="4 3"/>'
       +'<text x="'+(xs(s.avgAge)+3)+'" y="24" font-size="9.5" fill="#8f3040">全司均齡 '+s.avgAge+'</text>'
       +'<line x1="'+PX+'" y1="'+ys(s.avgTenure)+'" x2="'+(W-16)+'" y2="'+ys(s.avgTenure)+'" stroke="#8f3040" stroke-dasharray="4 3"/>'
       +'<text x="'+(W-18)+'" y="'+(ys(s.avgTenure)-4)+'" font-size="9.5" fill="#8f3040" text-anchor="end">均資 '+s.avgTenure+'</text>';
    s.unitOrder.forEach(function(nm){
      var u=s.units[nm],col=u.group==='總公司'?C_HQ:C_SITE,r=4+Math.sqrt(u.count)*1.7;
      svg+='<circle cx="'+xs(u.avgAge).toFixed(1)+'" cy="'+ys(u.avgTenure).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+col+'" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"><title>'+esc(nm)+'：均齡 '+u.avgAge+'・均資 '+u.avgTenure+'・'+u.count+' 人</title></circle>'
         +'<text x="'+(xs(u.avgAge)+r+3).toFixed(1)+'" y="'+(ys(u.avgTenure)+3).toFixed(1)+'" font-size="10" fill="#2c2c2b">'+esc(nm)+'</text>';
    });
    html+='<div class="card"><div class="sec-h"><b>⑦ 單位健康矩陣</b><small>一點＝一個單位；越右越年長、越上越資深、點越大人越多；右上淡紅＝雙高單位</small></div>'
        +legend(['總公司','工地'],[C_HQ,C_SITE])
        +'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+svg+'</svg></div>';
  })();
  // 8 職能×年齡結構（人數降冪·色越深越年長）
  if(s.roleAge){
    var roles=Object.keys(s.roleCounts).sort(function(a,b){return s.roleCounts[b]-s.roleCounts[a];});
    var roleUnits={},maxRole=1;
    roles.forEach(function(k){roleUnits[k]={count:s.roleCounts[k],age:s.roleAge[k]||[0,0,0,0,0]};if(s.roleCounts[k]>maxRole)maxRole=s.roleCounts[k];});
    html+='<div class="card"><div class="sec-h"><b>⑧ 職能×年齡結構</b><small>每列拉成 100%，看各職能的年齡比例；人數在右</small></div>'
        +legend(s.ageSegLabels,RAMP5)
        +propRows(roles,roleUnits,'age',RAMP5,s.ageSegLabels)
        +numTable(roles,roleUnits,'age',s.ageSegLabels)+'</div>';
  }
  // 9 未來退休曲線：每年將滿 65 的人數（由年齡推算·±1年）
  if(s.agePairs&&s.agePairs.length){
    var thisY=new Date().getFullYear();
    var rc={labels:['已滿65'],counts:[0]};
    for(var i2=0;i2<=10;i2++){rc.labels.push("'"+String(thisY+i2).slice(2));rc.counts.push(0);}
    s.agePairs.forEach(function(p){
      var a2=p[0];
      if(a2>=65)rc.counts[0]++;
      else if(65-a2<=10)rc.counts[65-a2+1]++;
    });
    html+='<div class="card"><div class="sec-h"><b>⑨ 未來退休曲線</b><small>柱＝每年將滿 65 歲的人數（依年齡推算·誤差±1年）；線＝累計退休人數</small></div>'
        +colChart(rc,{ramp:SHADE.retire,lollipop:true,lines:[{label:'累計',color:'#763640',endLabel:true,
          values:rc.counts.map(function(v,i,a){return a.slice(0,i+1).reduce(function(x,y){return x+y;},0);})}]})+'</div>';
  }
  // 10 退休衝擊率：5年內(含已滿65)退休人數 ÷ 單位人數——哪個單位會被掏空
  (function(){
    var rows=s.unitOrder.map(function(nm){
      var u=s.units[nm],hit=u.retire.now.length+u.retire.y5.length;
      return {nm:nm,hit:hit,count:u.count,rate:hit/u.count};
    }).filter(function(x){return x.hit>0;}).sort(function(a,b){return b.rate-a.rate;});
    if(rows.length){
      var maxR=rows[0].rate;
      html+='<div class="card"><div class="sec-h"><b>⑩ 退休衝擊率</b><small>5 年內退休（含已滿65）÷ 單位人數；比例越高越先被掏空</small></div>'
        +dotRows(rows,maxR,'#763640')+'</div>';
    }
  })();
  // 11 退休預警名單
  var retTotal=function(nm){var R=s.units[nm].retire;return R.now.length+R.y5.length+R.y10.length;};
  var retWeight=function(nm){var R=s.units[nm].retire;return R.now.length*100+R.y5.length*10+R.y10.length;};  // 急迫度：已滿65≫5年內≫10年內
  var retUnits=s.unitOrder.filter(function(nm){return retTotal(nm)>0;}).sort(function(a,b){return retWeight(b)-retWeight(a);});
  html+='<div class="card"><div class="sec-h"><b>⑪ 退休預警名單</b><small>已滿 65／5 年內滿 65（60-64 歲）／10 年內（55-59 歲）</small></div>'
      +legend(['已滿 65','5 年內','10 年內'],C_RET);
  if(!retUnits.length) html+='<div class="empty" style="padding:16px 0">目前沒有 55 歲以上的在職同仁</div>';
  retUnits.forEach(function(nm){
    var R=s.units[nm].retire, total=R.now.length+R.y5.length+R.y10.length;
    var segs=[R.now.length,R.y5.length,R.y10.length];
    var w=Math.max(total/maxCount*100,2);
    var inner=segs.map(function(c,i){ if(!c)return '';
      return '<div class="seg" style="flex:'+c+';background:'+C_RET[i]+'"></div>';}).join('');
    html+='<div class="hrow"><div class="nm">'+esc(nm)+'</div><div class="trk" style="max-width:'+w+'%">'+inner+'</div><div class="cnt">'+total+'</div></div>'
        +(s.pub
          ? '<div class="names" style="margin-left:96px;color:#9a9a96">名單需權限，載入中…</div>'
          : '<div class="names" style="margin-left:96px">'
            +(R.now.length?'<b>已滿65：</b>'+R.now.map(esc).join('、')+'　':'')
            +(R.y5.length?'<b>5年內：</b>'+R.y5.map(esc).join('、')+'　':'')
            +(R.y10.length?'<b>10年內：</b>'+R.y10.map(esc).join('、'):'')+'</div>');
  });
  html+='</div>';
  main.innerHTML=html;
}
(function () {
  var TOKEN = q('t');
  var painted = false;
  cacheBootstrap(TOKEN).then(function () {
    var c = cacheGet(N.hrStats);
    if (c) { renderHr(c.value); painted = true; markOffline(null); }   // 重訪：秒顯
    else {                                                              // 首訪：靜態聚合先畫圖表
      fetch('hr-stats-pub.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (p) { if (p && p.ok && !painted) { renderHr(p); painted = true; } })
        .catch(function () { });
    }
    return queueRead(function () {
      return jsonp('getHrStats', { token: TOKEN }).then(function (r) {
        return handleVerdict(TOKEN, r).then(function (v) {
          if (v === 'revoked') return;                       // 覆蓋層已蓋上
          if (v === 'offline') { if (c) markOffline(c.savedAt); else if (!painted) renderHr(r); return; }
          return cacheSave(TOKEN, N.hrStats, r).then(function () {
            if (r && r.ok) { renderHr(r); markOffline(null); }
            else if (!painted) renderHr(r);
          });
        });
      });
    });
  });
})();

/** 離線標示：有 savedAt 就掛上去，傳 null 代表連上了、拿掉標示。
 *  掛在 #sub（頁面標題下的 meta 列）——本頁沒有 id="meta"，#sub 是同一個角色：
 *  attend.html/checkin.html/stats.html 都用 id="meta" 放這行「載入中…→資料來源說明」的字。 */
function markOffline(savedAt) {
  var el = document.getElementById('sub');
  if (!el) return;
  var tag = document.getElementById('offline-tag');
  if (savedAt == null) { if (tag) tag.parentNode.removeChild(tag); return; }
  if (!tag) { tag = document.createElement('span'); tag.id = 'offline-tag';
    tag.setAttribute('style', 'margin-left:8px;color:#8a6a2f;font-size:13px'); el.appendChild(tag); }
  tag.textContent = offlineLabel(savedAt);
}
