<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="assets/app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>人事異動看板</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<script src="assets/groups.js"></script>
<style>
  .brand { text-align: center; margin: 0 0 14px; }
  .brand img { width: 100%; max-width: 240px; height: auto; }
  /* 未送出警語：放在頁首固定區，不可塞進會被 innerHTML='' 清空的資料容器 */
  .alert-bar { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 8px;
               background: #fdecec; border: 1px solid #f5b5b5; color: #b00;
               font-size: 14px; font-weight: 600; line-height: 1.6; }
  .toplinks { text-align: right; margin: 0 0 10px; }
  .toplinks a { font-size: 13.5px; color: #06c755; text-decoration: none; font-weight: 600; }
  .toplinks a:hover { text-decoration: underline; }
  .toplinks a[hidden] { display: none; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    padding: 20px 16px 40px; font-size: 16px; line-height: 1.6; color: #333;
    background: #f7f7f7; max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1a1a1a; }
  .who { font-size: 13px; color: #888; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .rowdate { font-size: 13px; color: #888; margin-bottom: 12px; }
  label { display: block; margin: 0 0 6px; font-size: 14px; color: #555; font-weight: 600; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 15px; font-family: inherit; background: #fafafa; margin-bottom: 14px; -webkit-appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: #06c755; background: #fff; }
  .email-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .email-row input { margin-bottom: 0; flex: 1; min-width: 0; }
  .email-row .suffix { font-size: 14px; color: #777; white-space: nowrap; }
  .titlefield input { margin-bottom: 4px; }
  .linkbtn { background: none; border: none; color: #06c755; font-size: 13px; padding: 4px 0 10px; cursor: pointer; font-family: inherit; -webkit-appearance: none; width: auto; }
  .btn { display: block; width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: #06c755; color: #fff; }
  .btn-primary:active { background: #05a847; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg-ok { background: #e6f9ee; color: #1a7d44; }
  .msg-err { background: #fdecea; color: #b71c1c; }
  .msg-info { background: #e8f0fe; color: #1a56c4; }
  .empty { text-align: center; color: #888; padding: 40px 0; font-size: 15px; }
  .sec { font-size: 15px; color: #666; margin: 28px 0 10px; }
  /* tabs（2026-07-15 員工名冊分頁） */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .tabs button { flex: 1 1 28%; padding: 11px 0; font-size: 16px; font-weight: 700; color: #666;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; cursor: pointer; font-family: inherit; }
  .tabs button.on { background: #06c755; border-color: #06c755; color: #fff; }
  .r-count { font-size: 15px; color: #666; margin-bottom: 10px; }
  .r-count b { color: #1a1a1a; font-size: 20px; }
  .r-search { margin-bottom: 12px; }
  .st-off { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #fdecea; color: #b71c1c; margin-left: 8px; }
  .resend { background: none; border: 1px solid #ddd; border-radius: 8px; color: #555; font-size: 13px;
    padding: 4px 10px; cursor: pointer; font-family: inherit; margin-top: 6px; -webkit-appearance: none; }
  .resend-msg { font-size: 13px; margin-top: 4px; }
  .resend-msg.ok { color: #1a7d44; } .resend-msg.err { color: #b71c1c; }
  /* 名冊：依單位收合（同統計看板樣式） */
  .grp { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 8px; overflow: hidden; }
  .grp summary { padding: 13px 14px; cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
  .grp summary::-webkit-details-marker { display: none; }
  .grp summary::before { content: '▸'; color: #bbb; font-size: 13px; transition: transform .15s; }
  .grp[open] summary::before { transform: rotate(90deg); }
  .grp .cnt { color: #888; font-weight: 400; font-size: 14px; }
  .grp .done-item { padding-left: 30px; }
  /* 名冊：最近 20 筆更新/異動標紅＋更新日期 */
  .grp summary.hot { color: #c62828; }
  .done-name.hot { color: #c62828; }
  .upd { font-size: 12px; color: #c62828; background: #fdecea; padding: 1px 7px; border-radius: 10px; margin-left: 8px; white-space: nowrap; }
  .done-list { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  .done-item { padding: 12px 14px; border-bottom: 1px solid #eee; }
  .done-item:last-child { border-bottom: none; }
  .done-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
  .done-name { font-weight: 700; font-size: 17px; color: #1a1a1a; }
  .done-date { font-size: 14px; color: #999; white-space: nowrap; }
  .done-meta { font-size: 15px; color: #666; margin-top: 3px; word-break: break-word; }
  .done-move { font-size: 15px; color: #333; margin-top: 4px; word-break: break-word; }
  .mi { display: inline-block; margin: 2px 16px 0 0; white-space: nowrap; }
  .mi i { font-style: normal; font-size: 12px; color: #9aa0a6; margin-right: 4px; }
  .mi b { font-weight: 400; color: #555; }
  .done-doc { font-size: 12px; color: #bbb; margin-top: 4px; }
  /* ── 長者友善：放大預設字級（2026-06-26）─────────────────────────────────── */
  body { font-size: 17px; }
  input, select { font-size: 16px; }
  label { font-size: 15px; }
  .empty, .sec { font-size: 16px; }
  .msg, .linkbtn { font-size: 15px; }
  .rowdate, .who { font-size: 14px; }
  .email-row input { min-width: 55%; }
  /* ── 桌機（≥768px）：加寬版面＋再放大字，年長人事友善；手機不受影響 ────────── */
  @media (min-width: 768px) {
    body { max-width: 760px; padding: 32px 24px 60px; font-size: 19px; }
    h1 { font-size: 26px; }
    .who { font-size: 16px; }
    .card { padding: 28px 32px; }
    .rowdate { font-size: 15px; }
    label { font-size: 17px; }
    input, select { font-size: 18px; padding: 12px 14px; }
    .email-row .suffix { font-size: 16px; }
    .btn { font-size: 19px; padding: 15px; }
    .sec { font-size: 19px; }
    .empty { font-size: 18px; }
    .done-item { padding: 16px 20px; }
    .done-name { font-size: 19px; }
    .done-meta { font-size: 16px; }
    .done-move { font-size: 16px; }
    .done-date { font-size: 15px; }
    .linkbtn { font-size: 16px; }
    /* 待確認卡：桌機最多兩欄。1 張＝單欄置中；≥2 張＝並排，超過自動換列(2+1…)。
       用 :has 偵測卡片數自動切換，核准後卡片減少也會自動縮回。手機(<768)維持單欄。 */
    #pending { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    #pending .card { margin-bottom: 0; }
    #pending .empty { grid-column: 1 / -1; }
    #pending:has(.card ~ .card) { grid-template-columns: 1fr 1fr; }
    body:has(#pending .card ~ .card) { max-width: 940px; }
  }
</style></head><body>

</div>

  <div class="who">系統從人事公告整理出待確認清單，請逐筆核對「新職稱、新單位、生效日」後確認</div>
  <div id="hr-pending"><div class="empty">載入中…</div></div>
</div>
<div id="tab-maint" style="display:none">
  <h1>資訊維護</h1>
  <div class="who">單位與職稱的統一管理；這裡的清單是各表單（異動核定、新人報到）下拉的來源</div>
  <div class="card">
    <label>整批轉移：舊單位（全體在職同仁一起換）</label>
    <select id="bt-old"><option value="">── 請選擇 ──</option></select>
    <label>新單位</label>
    <input id="bt-new" placeholder="輸入新單位名稱">
    <div class="msg" id="bt-msg"></div>
    <button class="btn btn-primary" onclick="batchTransfer()">整批轉移</button>
  </div>
  <div class="card">
    <label>新增單位（先建名稱讓報到／調動選得到）</label>
    <input id="au-name" placeholder="新單位名稱">
    <label>分類</label>
    <select id="au-group"><option selected>工地</option><option>總公司</option></select>
    <div class="msg" id="au-msg"></div>
    <button class="btn" style="background:#f0f0f0;color:#333" onclick="addUnitGo()">＋ 新增單位</button>
  </div>
  <div class="card">
    <label>新增職稱（異動核定與新人報到的職稱下拉共用）</label>
    <input id="at-name" placeholder="新職稱名稱">
    <label>分類</label>
    <select id="at-group"><option>工務／工程</option><option>機電</option><option>繪圖／規劃</option><option>行政／管理</option><option selected>其他</option></select>
    <label>開放新人報到時自選</label>
    <select id="at-self"><option selected>是</option><option>否</option></select>
    <div class="msg" id="at-msg"></div>
    <button class="btn" style="background:#f0f0f0;color:#333" onclick="addTitleGo()">＋ 新增職稱</button>
  </div>
  <div class="card">
    <label>調整既有選項（改分類／是否開放新人自選／停用）</label>
    <select id="eo-pick" onchange="editOptionPick()"><option value="" selected>── 請選擇 ──</option></select>
    <div id="eo-fields" style="display:none">
      <label>分類</label>
      <select id="eo-group"></select>
      <div id="eo-self-wrap" style="display:none"><label>開放新人報到時自選</label>
        <select id="eo-self"><option>是</option><option>否</option></select></div>
      <label>狀態（停用＝從所有下拉消失，歷史資料不動）</label>
      <select id="eo-status"><option>啟用</option><option>停用</option></select>

      <button class="btn btn-primary" onclick="saveOptionGo()">儲存調整</button>

<div id="tab-roster" style="display:none">

  <div id="r-count" class="r-count">載入中…</div>
  <div id="anniv-box" style="display:none"></div>
  <input id="r-search" class="r-search" type="search" placeholder="搜尋姓名／單位／員編…" oninput="filterRoster()">
  <div style="margin:8px 0">
    <button class="btn btn-primary" onclick="downloadRoster()">📥 下載員工名冊（單位總表）</button>
    <button class="btn btn-primary" style="margin-top:8px" onclick="downloadRosterFlat()">📥 下載員工名冊（逐人明細）</button>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:400;color:#555">
      <input type="checkbox" id="r-dl-leavers" style="width:auto;margin:0">列出離職同仁（僅逐人明細適用）

<div id="tab-log" style="display:none">

  <div class="who">公告異動與資料修正都在這裡，最新在上</div>
  <div id="log-list"></div>
</div>

<script src="assets/roster-wide.js"></script>
<script src="assets/roster-dl.js"></script>
<script src="assets/anniv.js"></script>
<script src="assets/send-modal.js"></script>
<script src="assets/board-cache.js"></script>
<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
var EMAIL_DOMAIN='@jdc-corpn.com.tw';
var SENTINEL='（找不到，由人事填寫）';   // 新人「找不到」哨兵 → 看板停在請選擇
function getToken(){var m=location.search.match(/[?&]t=([^&]+)/);return m?decodeURIComponent(m[1]):'';}
// 管理者專屬跨看板切換（只有管理者的 token 顯示；受眾分離維持：人事/企劃等其他看板使用者看不到）
// ⚠️ 本 repo 為 PUBLIC，註解與程式碼都不要寫同仁真實姓名。
function showAdminSwitch(isAdmin){
  if(!isAdmin||document.getElementById('adm-switch'))return;
  var a=document.createElement('a');
  a.id='adm-switch';a.textContent='⇄ 活動紀錄看板';
  a.href='stats.html?t='+encodeURIComponent(TOKEN);
  a.style.cssText='position:fixed;top:10px;right:10px;z-index:99;background:#fff;border:1px solid #ddd;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:#333;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.12)';
  a.addEventListener('click',function(e){e.preventDefault();location.href=a.href;}); // iOS standalone：<a> 會彈內嵌 Safari，JS 導頁留在 App 內
  document.body.appendChild(a);
}
// fetch 匿名(credentials:'omit')：JSONP script 會帶瀏覽器 Google session，帳號狀態半殘的電腦被 Google 拒絕（2026-07-24 verify 實證後全站換）
function jsonp(action,params){
  var qs=Object.keys(params||{}).map(function(k){return '&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('');
  // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
  // 讓整段初始化同步當掉 → 畫面永遠停在「載入中」且不顯示任何錯誤（2026-07-31 查 attend.html 時發現，全站同型）。
  // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消（低頻看板無影響）。
  function attempt(){
    var timer, timeout=new Promise(function(_,rej){timer=setTimeout(function(){var e=new Error('timeout');e.name='AbortError';rej(e);},30000);});
    return Promise.race([timeout, fetch(GAS_URL+'?action='+encodeURIComponent(action)+qs+'&callback=cb',{credentials:'omit',redirect:'follow'})
      .then(function(r){return r.text();})
      .then(function(t){var a=t.indexOf('('),b=t.lastIndexOf(')');if(a===-1||b===-1)throw new Error('bad');return denyNoRole(JSON.parse(t.slice(a+1,b)));})])
      .then(function(v){clearTimeout(timer);return v;},function(e){clearTimeout(timer);throw e;});
  }
  // 30s＋逾時/斷線自動重試一次（隔 2s，8/6 對策 1）：GAS 偶發 8-17s 長尾踩 15s 斷頭線
  // 是「連線逾時」主因，放寬＋重試把長尾事件變成「慢但載得出來」。正常回應（含 ok:false）不重試。
  return attempt().catch(function(){
    return new Promise(function(res){setTimeout(res,2000);}).then(attempt);
  }).catch(function(e){return {ok:false,msg:(e&&e.name==='AbortError')?'連線逾時（伺服器喚醒中），請重新整理再試。':'連線失敗'};});}
var TOKEN=getToken();
var CACHE_READY=cacheBootstrap(TOKEN);   // 開頁時解密該指紋的全部持久快取；cacheGet 在它 resolve 前都讀不到值

// ── LINE 訊息紀錄連結與未送出警語 ────────────────────────────────────────
// ⚠️ 暫停對承辦人露出（2026-08-20 使用者指示）：功能完整保留，只是不接上。
//    要上線把下面這個常數改成 true——**但不是只改這一個字就好**：
//    `getUndelivered` 的呼叫點在首載批次之前、而且沒走 queueRead，
//    旗標一翻它就會與首載批次同時起跑，違反本站「同頁任一時刻最多一支 /exec」。
//    （yu-agent-a5 在 bb72b32 實測：getUndelivered 34→2135ms 與 batch 35→6034ms
//      重疊。**現在量不到並行是因為旗標是 false，不是因為修好了。**）
//    修法：把這段移到第二發批次之後，再包 queueRead——警語晚幾秒到沒有代價；
//    不要併進首載 batch，那會讓首屏多等 2 秒。
//    ⚠️ 這個開關**不管** stats.html 的資深通知三態顯示——那是安全機制，
//       斷了會讓小字永遠空白（後端已不回舊的 SN.sent），故意不放進來。
var MSG_LOG_UI_ON = false;

// 連結用 ?mt= 帶 hub 的 viewer token，與看板自己的 ?t= 分開：
// 一顆給 line-platform、一顆給 hub，權限來源不同，不可共用。
// 沒帶 mt 就不顯示連結——顯示一個點了必定失敗的連結比不顯示更糟。
(function () {
  if (!MSG_LOG_UI_ON) return;
  var mt = new URLSearchParams(location.search).get('mt') || '';
  var a = document.getElementById('msgLogLink');
  if (mt) {                       // messages.html 與本頁同站台，用相對路徑
    a.href = 'messages.html?t=' + encodeURIComponent(mt);
    a.hidden = false;
  }
})();

if (MSG_LOG_UI_ON) {
  jsonp('getUndelivered', { token: TOKEN }).then(function (r) {
    if (r && r.ok && r.pending > 0) {
      var bar = document.getElementById('alertBar');
      bar.textContent = '🔴 有 ' + r.pending + ' 則 LINE 訊息沒有送出去，請開試算表的「未送出」分頁確認是否要重發。';
      bar.style.display = 'block';
    }
  });
}

// 首載合併（2026-08-06）：4 支 /exec → 1 支 batch。/exec 每請求固定成本 2-4s、偶發 8-17s 長尾，
// 多支並行佔執行位是「連線逾時」爆量排隊的火種。pick(a) 把整包切片給既有 render 函式；
// batch 整包失敗時每個 key 都拿到 {ok:false,msg:…} → 各區塊走原本的錯誤路徑，行為與單支失敗相同。
// 互動後的重抓（切活動、核定後刷新）仍走單支 jsonp——batch 只管首載這一發。
// 2026-08-19：SWR（sessionStorage）換成持久快取——原本關分頁即清，每次開頁都白等。
// 首載四支各自一個名稱、各自過一次守門（persistBatchSlices）——不可存 batch 外層整包，
// 外層 ok:true 會讓內層 {ok:false} 被夾帶存七天，見 assets/board-cache.js 的註解。
var FIRST_ITEMS=[{a:'getCheckinOptions'},{a:'getCheckinPending'},
                 {a:'getHrPending'},{a:'getAnniversaries'}];
var FIRST=queueRead(function(){
  return jsonp('batch',{token:TOKEN,list:JSON.stringify(FIRST_ITEMS)}).then(function(env){
    return handleVerdict(TOKEN,env).then(function(v){
      if(v!=='ok')return {ok:false,_verdict:v,msg:env.msg};
      return persistBatchSlices(TOKEN,env,FIRST_ITEMS,nameOfSlice).then(function(){return env;});
    });
  });
});
function pick(a){return FIRST.then(function(r){
  return (r&&r.ok&&r.results&&r.results[a])||{ok:false,msg:(r&&r.msg)||'連線失敗'};});}
// 離線標示：掛在 #who（tab-checkin 標題下的 meta 列）。board.html 沒有 id="meta"／id="sub"，
// 五個分頁也沒有共用的頁首列；#who 是預設分頁裡同角色的元素——attend.html/hr-stats.html
// 放「載入中…→資料來源說明」的地方，這裡放的是「核准人：xxx」。
FIRST.then(function(env){
  if(env&&env._verdict==='offline'){
    return CACHE_READY.then(function(){
      var c=cacheGet(N.checkinPending);
      if(c)markOffline(c.savedAt);
    });
  }
  if(env&&env.ok)markOffline(null);
});
// 第二發：把其他三個分頁的資料先抓回來，點進去就不用等。
// 排在第一發之後（不是同時發）——首屏速度完全不受影響，而同頁最多一支 /exec 在飛。
var SECOND_ITEMS=[{a:'getRosterList'},{a:'listHrNotices'},{a:'listOptions'}];
var SECOND=FIRST.then(function(first){
  if(!first||first.ok!==true)return null;   // 第一發撤銷或離線 → 不送第二發
  return queueRead(function(){
    return jsonp('batch',{token:TOKEN,list:JSON.stringify(SECOND_ITEMS)}).then(function(env){
      if(cacheVerdict(env)!=='ok')return null;
      return persistBatchSlices(TOKEN,env,SECOND_ITEMS,nameOfSlice).then(function(){return env;});
    });
  });
});
// pick2：切片必須存在且 slice.ok===true 才回傳，否則回 null。
// 只檢查外層 ok 不夠——{ok:false} 的切片會被當成資料傳給 loader，loader 收到「有值」
// 就直接 render，不會再查一次 ok，畫面會顯示怪東西且不報錯。
//
// ⚠️ 一次性消費（takeOnce）：SECOND 只 resolve 一次，同一個 action 問第二次拿到的還是那份
// 開頁當下的快照。新增單位／職稱→loadOptionsAdmin、恢復已駁回異動→loadLog 都是
// 「寫入後重載」，被舊快照攔截的話新選項不會出現、已恢復的那筆仍顯示「已駁回」，
// 全程零錯誤訊息。第一發那條線本來就有 hrFirst 這個旗標（見 loadHr），這裡把同一個
// 語義補給第二發。
var _second_used={};
function pick2(a){
  return SECOND.then(function(r){
    if(!takeOnce(_second_used,a))return null;   // 已經消費過 → 呼叫端自己重打
    var slice=r&&r.results&&r.results[a];
    return (slice&&slice.ok===true)?slice:null;
  });
}

// ── 呼叫 nonce（2026-08-21）────────────────────────────────────────────
// 為何：GET 被瀏覽器視為安全可重試，連線在回應前中斷時會靜默重發，而 GAS 要
// 2–4 秒才回、窗口很寬。後端拿 nonce 認領：沒見過→照跑並存結果；已完成→**重播
// 第一次的結果**。本頁十支寫入動作自己都有狀態守門，資料本來就不會被寫兩次；
// nonce 治的是另一件事——重送時頁面收到的是第二次的回應，於是動作明明成功了，
// 畫面卻說「此筆已處理」「已存在」。那是「送達卻回報失敗」的同一個形狀。
//
// ⚠️ **必須在使用者點擊的那一刻產生，而且要在 confirm()／prompt() 之前、
//    jsonp() 之外。** 寫在 jsonp 裡面的話每次重送都拿到新的 nonce，後端會把它
//    當成新的一次操作，整件事白做——而且安靜地白做。
// ⚠️ 本頁有四支的呼叫在 onclick 處理器裡。nonce 要在**處理器內**產生，不可放到
//    外層的繪製函式——繪製只跑一次、點擊可以很多次，共用一個 nonce 會讓第二次
//    真正的點擊被當成重播而**靜默不執行**。這比沒有保護更糟。
// 唯讀 action 一律不帶 nonce：每個帶 nonce 的呼叫要多一次 ScriptLock 與兩次
// Property 讀寫，而讀取重播本來就無害，不值得付這個成本。
function newNonce(){
  return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
}
// 動作狀態視窗用共用元件 assets/send-modal.js（sendModal / sendModalClose）。
// 為何用共用檔而不是本頁自己寫一份：兩頁的視窗要長一樣、改一次就好；
// 而且那支刻意不引用任何頁面的 CSS 變數或 class——本頁沒有 --ink／--bad／
// .btn-pri2，照抄 stats.html 的版本會變成透明字且不報錯。
//
// ⚠️ busy 視窗沒有關閉鍵、點背景也不關，唯一的出口是請求回來。
//    本頁 jsonp() 最後一段 catch 會把任何失敗（含逾時、含重試後仍失敗）轉成
//    {ok:false}，所以 .then 一定會執行、視窗不會永遠關不掉。已實測確認。
//    改 jsonp 時要一起想這件事。
// 行內訊息與視窗一起更新，兩處文案一致——不要在呼叫端各寫一次，會漂移
function actDone(el,text,type){setMsg(el,text,type);sendModal(type==='err'?'err':'done',text);}

  var msg=d.querySelector('.msg');
  d.querySelector('.btn').onclick=function(){
    var nonce=newNonce();   // ⚠️ 點擊當下產生，在處理器內、jsonp 之外。理由見 newNonce 上方。
    if(!val('員編').trim()){setMsg(msg,'請先補員工編號再核准。','err');return;}

    var pre=emailPrefix(val('email-prefix')).replace(/\s/g,'');

      .then(function(r){

var hrFirst=true;
function loadHr(){
  var cached=null;
  // 秒顯（2026-08-20）：這一支本來只寫進快取、沒有任何地方讀回來——姓名在磁碟上躺七天卻零好處。
  // 補上讀取端之後，重開頁時人事異動分頁跟其他分頁一樣先畫舊的、網路回來再覆蓋。
  // 只在首發做：核定／駁回／轉移之後的刷新一律看網路，不能回舊快照。
  if(hrFirst){
    CACHE_READY.then(function(){
      cached=cacheGet(N.hrPending);
      if(cached){paintHr(cached.value);watchDirty('hr-pending');}
    });
  }else{
    // 核定／駁回／轉移之後的刷新是**使用者主動觸發**的，本來就該看到新的——
    // 清掉髒標記，不要被上一輪的編輯狀態擋住。
    clearDirty('hr-pending');
  }
  // 首發吃 batch 切片；之後的刷新（核定/駁回/轉移後）必須重打，不能回舊快照
  var src=hrFirst?pick('getHrPending'):jsonp('getHrPending',{token:TOKEN});
  hrFirst=false;
  src.then(function(r){
    if(r&&r.ok){
      logLoaded=false;   // 異動紀錄可能已變，下次切過去重抓（與畫不畫無關，一律要設）
      // ⚠️ 同 load()：這格有「生效日（核定）」可編輯，重繪會抹掉使用者改到一半的日期。
      if(isDirty('hr-pending')){hintStale('hr-pending');return;}
      paintHr(r);
    }
    // 失敗時只有「畫面上還沒有東西」才把錯誤蓋上去——否則會把剛秒顯的內容抹掉
    else if(!cached)paintHr(r);
    watchDirty('hr-pending');
  });
}

    +hrData.units.map(function(u){return '<option>'+esc(u)+'</option>';}).join('');
  var actionable=r.rows.filter(function(o){return String(o['狀態']).trim()!=='待生效';}).length;

// ⚠️ 這支刻意叫 paintRoster 不叫 renderRoster——renderRoster(rows,openAll) 已是既有函式
// （畫「一組 row 陣列」進 #r-list，filterRoster() 搜尋時也直接呼叫它）。若這支也取同名，
// 兩個簽名不同（一個吃 API 回應物件、一個吃陣列）的函式會互相覆蓋，filterRoster 會壞掉。
function paintRoster(r){
  if(!r||!r.ok){document.getElementById('r-count').textContent='';document.getElementById('r-list').innerHTML='<div class="empty">'+esc((r&&r.msg)||'載入失敗')+'</div>';return;}
  rosterRows=r.rows||[];
  // 最近 20 筆更新/異動 → 標紅＋顯示更新日期（有 updatedMs 的列，時間新→舊取前 20）
  rosterRows.forEach(function(o){o._recent=false;});
  rosterRows.filter(function(o){return o.updatedMs>0;})
    .sort(function(a,b){return b.updatedMs-a.updatedMs;})
    .slice(0,20).forEach(function(o){o._recent=true;});
  document.getElementById('r-count').innerHTML='在職 <b>'+r.activeCount+'</b> 人（名冊共 '+r.total+' 筆）';
  renderRoster(rosterRows);
}

 * 不重繪是為了保護他打到一半的字；但不告訴他就變成另一種騙人。
 */
function hintStale(id){
  var box=document.getElementById(id); if(!box||!box.parentNode) return;
  var tag=document.getElementById(id+'-stale');
  if(!tag){
    tag=document.createElement('div');
    tag.id=id+'-stale';
    tag.setAttribute('style','margin:0 0 10px;padding:8px 12px;border-radius:8px;'
      +'background:#fff8e1;border:1px solid #ffe082;color:#8a6d00;font-size:14px;line-height:1.6');
    box.parentNode.insertBefore(tag,box);
  }
  tag.textContent='⚠️ 伺服器上有較新的資料，但你正在下面編輯，畫面先不更新以免蓋掉你打的字。送出後或重新整理即可看到最新版。';
}

function load(){
  var co=null, cp=null;
  CACHE_READY.then(function(){
    co=cacheGet(N.checkinOptions); cp=cacheGet(N.checkinPending);
    if(co&&cp){renderLoad([co.value,cp.value]);watchDirty('pending');}   // 秒顯
    else document.getElementById('pending').innerHTML='<div class="empty">載入中…</div>';
  });
  // 兩份資料改由首載 batch 一次帶回（load() 只在開頁呼叫一次，直接吃切片即可）
  // ⚠️ 這裡不呼叫 cacheSave——FIRST 裡的 persistBatchSlices 已經存過，呼叫端再存一次就繞過唯一入口。
  Promise.all([pick('getCheckinOptions'), pick('getCheckinPending')]).then(function(rs){
    // ⚠️ 這裡是 SWR 的第二次繪製。這幾張卡上有四個可編輯欄位（姓名／生日／公司信箱／員編），
    // 人事正在補打時直接重繪會**靜默抹掉她打的字**，欄位回到後端舊值，她按核准就寫錯資料進名冊。
    // 2026-08-20 stats.html 的資深通知就是同一形狀出事的（19 人誤發），只是那邊是吵的、這邊是安靜的。
    if(isDirty('pending')){hintStale('pending');return;}
    if(rs[1]&&rs[1].ok)renderLoad(rs);
    else if(!(co&&cp))renderLoad(rs);
    watchDirty('pending');
  });
}
function renderLoad(rs){
    var opt=rs[0], r=rs[1];
    if(opt&&(opt.units||opt.titles))gOpts=opt;
    if(opt&&(opt.unitGroups||opt.titleGroups))window.JDC_GROUPS={unitGroups:opt.unitGroups,titleGroups:opt.titleGroups};   // 分組吃選項主檔「分類」欄
    var box=document.getElementById('pending');
    if(!r||!r.ok){box.innerHTML='<div class="empty">'+((r&&r.msg)||'連結無效或已失效。')+'</div>';return;}
    document.getElementById('who').textContent='核准人：'+r.who;
    showAdminSwitch(r.admin);
    box.innerHTML='';
    if(!r.rows.length) box.innerHTML='<div class="empty">目前沒有待確認的報到 🎉</div>';
    else r.rows.forEach(function(o){box.appendChild(renderRow(o));});
    updateBadge(r.rows.length);
    var done=r.done||[]; var list=document.getElementById('donelist'); list.innerHTML='';
    if(done.length){ document.getElementById('doneWrap').style.display=''; list.innerHTML=done.map(doneItemHtml).join(''); }
}
/** 離線標示：有 savedAt 就掛上去，傳 null 代表連上了、拿掉標示。
 *  掛在 #who——board.html 沒有 id="meta"／id="sub"，五個分頁也沒有共用的頁首 meta 列；
 *  #who 是 tab-checkin（預設分頁）標題下的那一行，跟 attend.html #meta、hr-stats.html #sub
 *  是同一個角色（本來放「載入中…→核准人：xxx」）。 */
function markOffline(savedAt){
  var el=document.getElementById('who');
  if(!el)return;
  var tag=document.getElementById('offline-tag');
  if(savedAt==null){if(tag)tag.parentNode.removeChild(tag);return;}
  if(!tag){tag=document.createElement('span');tag.id='offline-tag';
    tag.setAttribute('style','margin-left:8px;color:#b26a00;font-size:13px');el.appendChild(tag);}
  tag.textContent=offlineLabel(savedAt);
}

  msg: function (t, ty) { var el = document.getElementById('r-dl-msg'); el.className = 'msg show msg-' + (ty || 'info'); el.textContent = t; } });
