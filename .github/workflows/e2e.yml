name: 前端 E2E（Playwright）

# 為什麼獨立一支：test.yml 是零相依的 node --test，跑幾秒鐘；
# 這一支要 npm ci + 下載瀏覽器，跑幾分鐘。混在一起會讓原本很快的那道閘門變慢，
# 而「閘門變慢」的下場是有人去繞過它。
#
# ⚠️ 這個 repo 在 2026-08-29 之前是零相依的。正式頁面**仍然**不依賴任何 npm 套件
#    ——package.json 只為了這支測試而存在。

on:
  push:
    branches: [main]
    paths: ['**.html', 'assets/**.js', 'tests/e2e/**', 'package.json',
            'playwright.config.js', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['**.html', 'assets/**.js', 'tests/e2e/**', 'package.json',
            'playwright.config.js', '.github/workflows/e2e.yml']
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      # ⚠️ 裝的是 chrome 不是 chromium——config 用 channel: 'chrome'，
      #    裝 chromium 的話 CI 會在啟動時報「找不到 chrome」。
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
