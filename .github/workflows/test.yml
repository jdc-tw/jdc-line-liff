name: 前端單元測試

# 為什麼有這支（2026-08-19）：本 repo 原本只有 syntax-check.yml，tests/ 底下的
# 測試沒有任何 workflow 會跑。看板快取那批改動寫進數十條測試，沒有閘門等於它們
# 擋不住任何東西——推 main 即 Pages 發布，改壞了沒人會知道。

on:
  push:
    branches: [main]
    # ⚠️ `tests/**` 不寫成 `tests/**.js`：`tests/fixtures/action-roles.json`（後端產的
    #    權限矩陣副本）是 page-action-gate 的判斷依據，只改它而不觸發 CI
    #    ＝**改了守門的依據卻沒有任何東西重跑守門**，而且完全靜默。
    paths: ['**.html', 'assets/**.js', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['**.html', 'assets/**.js', 'tests/**']
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      # ⚠️ 必須用萬用字元 tests/*.test.js。寫成目錄形式 `node --test tests/`
      # 在新版 Node 會噴 Cannot find module。
      - run: node --test tests/*.test.js
