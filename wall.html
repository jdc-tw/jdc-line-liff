<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>進場狀況</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<style>
  /* 整頁鋪滿的方格牆。單位靠**顏色**分辨（使用者原始需求），格子在流向上依單位相鄰，
     所以同色會聚成一片區域——即使兩個單位的色相接近，位置也分得開。
     色票走同一族的綠→青，只變色相與明度，不亂跳彩度：整面牆才不會花。 */
  :root {
    --r: #ac1335;
    --ink: #2c2c2b; --ink2: #6b6b68; --ink3: #9a9a96;
    --bg: #fbfbfa; --done: #ebebe8;
    --scrim: rgba(251,251,250,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --r: #e2879a;
      --ink: #e8e8e5; --ink2: #a9a9a4; --ink3: #7c7c78;
      --bg: #141413; --done: #232321;
      --scrim: rgba(20,20,19,.86);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 牆＝整個視窗。格子用 grid 的 1fr 平分，邊到邊剛好鋪滿，不留邊界 */
  /* 版面＝左邊單位清單（依未報到比例排序）＋ 右邊馬賽克牆。
     牆上只畫「還沒到」的格子——報到的直接從畫面消失，所以整面牆會一路縮到空。
     色塊在流向上依同一個排序相鄰，比例一變，整片顏色就換位置。 */
  #stage { position: fixed; inset: 0; display: flex; gap: clamp(16px, 2vw, 40px);
           padding: var(--pad-top, 60px) 26px 26px; }
  #legend { flex: 0 0 auto; width: var(--legw, 190px); display: flex; flex-direction: column;
            justify-content: center; gap: var(--leggap, 6px); overflow: hidden; }
  /* 沒有色塊符號（2026-08-18 使用者：沒人會去看）。單位名與人數靠在一起、整組靠右，
     貼著馬賽克牆——視線只在「還沒來的前幾個單位」與牆之間來回，不必橫跨空白。 */
  .lg { display: flex; align-items: baseline; justify-content: flex-end; gap: .5em;
        font-size: var(--legfs, 15px); color: var(--ink2); }
  .lg .nm2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 人數欄等寬且右對齊，單位名的右緣才會對齊成一直線。
     不給固定寬度的話，「9/9」比「18/18」窄，每一列的單位名右緣就會參差。 */
  .lg .ct { color: var(--ink3); font-variant-numeric: tabular-nums; font-size: .84em;
            flex: 0 0 auto; min-width: 3.2em; text-align: right; }

  /* 牆靠左貼著清單。置中的話人少時牆會飄到右半邊、跟清單拉開一大段空白 */
  #wallbox { flex: 1 1 auto; display: flex; align-items: center; justify-content: flex-start; }
  /* ⚠️ 格子間距是 CSS 與 JS 共用的數字（JS 要拿它算格子邊長）。只能有一個來源，
     所以定義在這裡、由 JS 讀 --gap，兩邊各寫一個數字必然會漂移。 */
  #wall { display: grid; gap: var(--gap, 6px); }
  .c { width: var(--cs); height: var(--cs); border-radius: 6px; background: var(--u);
       display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .c .nm { color: #fff; font-weight: 600; line-height: 1.1; text-align: center;
           padding: 2px; font-size: var(--nmfs); }
  /* 第二階的格子是淡色，白字會看不見。字色固定不隨主題變——格子底色也不隨主題變 */
  .c.light .nm { color: #2c2c2b; }

  /* ⚠️ pop 一定要掛在 .pop 上、放完就拿掉：CSS animation 的 fill 狀態會蓋過 inline style，
     格子若一直留著 animation，FLIP 寫進去的 transform 會被它吃掉、完全不動。 */
  .c.pop { animation: pop .45s ease both; }
  @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }

  /* 報到的格子先淡出縮小，讓「誰到了」看得見，之後才重排剩下的 */
  .c.out { opacity: 0; transform: scale(.6);
           transition: opacity .38s ease, transform .38s ease; }
  .lg.out { opacity: 0; transition: opacity .38s ease; }

  @media (prefers-reduced-motion: reduce) {
    .c.pop { animation: none; }
    .c.out, .lg.out { transition: none; }
  }

  /* 窄螢幕仍然是「左清單、右牆」（2026-08-18 使用者指定：手機也要單位在左邊）。
     只把左右間距收窄，把寬度讓給牆。舊版在這裡把清單搬到牆下方，已移除。 */
  @media (max-aspect-ratio: 4/5) {
    #stage { gap: 10px; padding-left: 12px; padding-right: 12px; }
  }

  /* 主要資訊置中在畫面上方（2026-08-18 使用者指定）。浮在牆上方，不佔走牆的空間。
     活動名一行、三個數字一行，整組水平置中——大螢幕上視線第一個落點就在正中央。 */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 2;
           display: flex; flex-direction: column; align-items: center; gap: 4px;
           padding: 14px 20px 16px; background: var(--scrim);
           backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .act { font-size: clamp(16px, 1.9vw, 28px); font-weight: 600; }
  .nums { display: flex; gap: clamp(14px, 2.2vw, 38px); align-items: baseline;
          flex-wrap: wrap; justify-content: center; }
  .n { display: flex; align-items: baseline; gap: 5px; }
  .n b { font-size: clamp(20px, 3.6vw, 52px); font-weight: 600; line-height: 1;
         font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .n span { font-size: clamp(10px, 1vw, 14px); color: var(--ink3); }
  .n.arrived b { color: #3f7a5e; }
  .n.left b { color: var(--r); }
  .n.total b { color: var(--ink3); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .n.arrived b { color: #8ab79c; }
  }

  /* 錯誤才出現。正常運作時畫面上只有四個資訊 */
  #msg { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: none;
         padding: 8px 20px 10px; background: var(--scrim); color: var(--r);
         backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         font-size: clamp(11px, .85vw, 14px); }
</style></head><body>

<div id="stage"><div id="legend"></div><div id="wallbox"><div id="wall"></div></div></div>

<header>
  <span class="act" id="act">載入中…</span>
  <div class="nums">
    <span class="n arrived"><b id="nArrived">—</b><span>已報到</span></span>
    <span class="n left"><b id="nLeft">—</b><span>未報到</span></span>
    <span class="n total"><b id="nTotal">—</b><span>總人數</span></span>
  </div>
</header>

<div id="msg"></div>

<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):'';}

// JSONP：同 stats.html 的作法。逾時用 Promise.race，不用 AbortController
// （iOS 12.1 以前沒有它，會讓整段初始化同步當掉且畫面不報錯）。
function jsonp(action,params){
  var qs=Object.keys(params||{}).filter(function(k){return params[k]!=='';})
    .map(function(k){return '&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('');
  var timer,timeout=new Promise(function(_,rej){
    timer=setTimeout(function(){rej(new Error('timeout'));},25000);});
  return Promise.race([timeout,
    fetch(GAS_URL+'?action='+encodeURIComponent(action)+qs+'&callback=cb',
      {credentials:'omit',redirect:'follow'})
      .then(function(r){return r.text();})
      .then(function(t){var a=t.indexOf('('),b=t.lastIndexOf(')');
        if(a===-1||b===-1)throw new Error('bad');return JSON.parse(t.slice(a+1,b));})])
    .then(function(v){clearTimeout(timer);return v;},function(e){clearTimeout(timer);throw e;});
}

/**
 * 單位配色＝**定性配色**（qualitative colour scheme，2026-08-18 改）。
 *
 * 類別型資料的標準做法：只讓色相變化，彩度與明度鎖在同一檔——這樣才是「繽紛」不是「花」。
 * 舊版把色環平均切成 n 份。問題在**類別數**：定性配色的人眼辨識上限大約 8–12 色，
 * 15 個單位切 15 份，必然出現兩兩認不出來的鄰居（實際跑起來就是這樣）。
 *
 * 解法＝**8 個色相 × 2 個階**：前八個單位用標準階，第九個起同色相走「更淡」的一階
 * （明度提高、彩度降低）。整體維持粉彩調（2026-08-18 使用者指定的色系），
 * 同色相的兩階又分得開。
 *
 * ⚠️ 兩次實測失敗留在這裡，別再走回去：
 * ① 一開始直接抄 Okabe-Ito 八色的**色相**（41/202/164/56/215/27/326/285）。
 *    那組色是為色覺障礙者設計的，但它的 sky blue 與 blue 本來靠**明度**區分，
 *    色相只差 13°——只取色相就撞在一起。實測最接近的三對 RGB 距離 12／13／18，
 *    數字上是 15 種顏色，肉眼是同一色。所以這裡用等距色相，不用它的色相清單。
 * ② 第二階一開始只「亮 12%」，同樣量到 15／17／17，等於沒分開。
 *
 * 另外兩個刻意的設定：
 * ・彩度壓到 38%（2026-08-17 使用者：繽紛但彩度低一點）——投在大螢幕上久看不累。
 * ・黃色段（45–75°）在淺底上對比最差，亮階明度單獨再壓低，否則第一眼像壞掉的格子。
 */
var UNIT_HUES=[20,55,100,155,200,250,295,335];
function unitStep(i){ return i>=UNIT_HUES.length; }   // true＝走「更淡」的第二階
function unitColor(i){
  var h=UNIT_HUES[i%UNIT_HUES.length],second=unitStep(i);
  /* ⚠️ 兩階只差明度，**彩度不能跟著降**。試過第二階降到 22%：
     彩度趨近 0 時所有色相都往灰收斂，七個淡階色互相之間只剩 16–30 的距離，
     等於七個單位共用一個顏色。這是色彩學的必然，不是調參數能繞過的。 */
  var lit=second?74:58;
  if(h>=45&&h<=75)lit-=8;   // 黃色段在淺底上對比最差，明度要再壓低
  return 'hsl('+h+',38%,'+lit+'%)';
}

/**
 * 配色的索引：綁**單位名稱**，不是綁「目前排第幾」（2026-08-18 修）。
 *
 * 後端的 units 依未報到比例排序，名次每 15 秒都在動。原本拿陣列索引去算色相，
 * 名次一掉顏色就跟著換——舊版整塊重畫看不太出來，改成滑動之後會變成
 * 「色塊一邊滑一邊變色」，整面牆再也讀不出「哪一片是哪個單位」。
 * 改用單位名排序後的固定位置：同一場活動內，一個單位的顏色從頭到尾不變。
 */
function colorIndex(units){
  var m={};
  units.map(function(u){return u.name;}).sort().forEach(function(n,i){m[n]=i;});
  return m;
}

/**
 * 欄數：讓整塊接近視窗的長寬比，格子維持正方形。
 * 只在 guess 附近試幾個，挑「最後一列空格最少」的那個——缺角越少，整塊越像一個完整的方陣。
 */
function bestCols(n,w,h){
  var guess=Math.max(1,Math.round(Math.sqrt(n*w/h)));
  var best=guess,score=Infinity;
  for(var c=Math.max(1,guess-4);c<=guess+4;c++){
    var rows=Math.ceil(n/c);
    var waste=c*rows-n;
    var sq=Math.abs(Math.log((w/c)/(h/rows)));
    // 「格子要方」壓過「缺角要少」。權重反過來的話，手機上會挑出 6 欄 × 23 列
    // ——缺角只有 1 格，但整塊縮成一條窄長方形、寬度完全沒用到（2026-08-17 實測）。
    var sc=sq*10+waste*0.4;
    if(sc<score){score=sc;best=c;}
  }
  return best;
}

/* ═══════ 移動（2026-08-18 使用者指定：左清單與右牆都隨出席比例逐一移動）═══════
 *
 * 做法是 FLIP：先量舊位置 → 換完 DOM → 把元素拉回舊位置 → 放開，瀏覽器就會把它滑過去。
 * 前提是**元素身分要留著**——舊版每 15 秒 innerHTML 整塊重畫，元素全是新的，
 * 沒有「舊位置」可言，畫面只會瞬間跳位。所以下面改成依 key 復用既有元素。
 *
 * key：單位＝單位名；格子＝單位名＋它在該單位裡的固定序號（後端已依員編排好，不會變）。
 */
function reduced(){
  return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function snap(box){
  var m={};
  Array.prototype.forEach.call(box.children,function(el){
    if(el.dataset.k)m[el.dataset.k]=el.getBoundingClientRect();
  });
  return m;
}
/** 依 key 復用既有元素、補新的、丟掉不在清單裡的，順序照 items 排好 */
function reconcile(box,items,make,upd){
  var old={};
  Array.prototype.forEach.call(box.children,function(el){ if(el.dataset.k)old[el.dataset.k]=el; });
  var frag=document.createDocumentFragment();
  items.forEach(function(it){
    var el=old[it.k];
    if(el){ delete old[it.k]; upd(el,it); } else { el=make(it); el.dataset.k=it.k; }
    frag.appendChild(el);
  });
  Object.keys(old).forEach(function(k){
    var e=old[k]; if(e.parentNode)e.parentNode.removeChild(e);
  });
  box.appendChild(frag);
}
/** stagger＝每個元素之間差幾毫秒。這就是「逐一」移動而不是整片一起搬 */
function flip(box,before,stagger){
  if(reduced())return;
  var moved=[];
  Array.prototype.forEach.call(box.children,function(el){
    var b=before[el.dataset.k]; if(!b)return;            // 新來的沒有舊位置，交給 pop 淡入
    var a=el.getBoundingClientRect();
    var dx=b.left-a.left, dy=b.top-a.top;
    var sc=(a.width>1&&b.width>1)?(b.width/a.width):1;   // 格子會隨人數變大，尺寸也要一起補
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5&&Math.abs(sc-1)<0.01)return;
    el.style.transition='none';
    el.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+sc.toFixed(4)+')';
    moved.push(el);
  });
  if(!moved.length)return;
  box.offsetHeight;   // 逼瀏覽器認一次舊位置，否則兩次設定會被合併成「沒有動畫」
  moved.forEach(function(el,i){
    el.style.transition='transform .55s cubic-bezier(.22,.61,.36,1) '+Math.min(i*stagger,700)+'ms';
    el.style.transform='';
  });
}
/** 這一輪要離場的（報到了／整個單位到齊了）先標記，讓它淡出，晚一點才真的移除 */
function markOut(box,keep,outs){
  Array.prototype.forEach.call(box.children,function(el){
    var k=el.dataset.k;
    if(k&&!keep[k]&&!el.classList.contains('out')){ el.classList.add('out'); outs.push(el); }
  });
}

function makeCell(it){
  var el=document.createElement('div');
  el.className='c pop';
  el.addEventListener('animationend',function(){ el.classList.remove('pop'); });
  updCell(el,it);
  return el;
}
function updCell(el,it){
  el.style.setProperty('--u',it.col);
  el.classList.toggle('light',!!it.light);
  var s=el.firstChild;
  if(it.n){
    if(!s){ s=document.createElement('span'); s.className='nm'; el.appendChild(s); }
    if(s.textContent!==it.n)s.textContent=it.n;
  } else if(s){ el.removeChild(s); }
}
function makeLg(it){
  var el=document.createElement('div');
  el.className='lg';
  el.innerHTML='<span class="nm2"></span><span class="ct"></span>';
  updLg(el,it);
  return el;
}
function updLg(el,it){
  el.firstChild.textContent=it.name;
  el.childNodes[1].textContent=it.left.length+'/'+it.total;
}

/** 只留還有人沒到的單位。到齊的整個消失——這頁的用途是「誰還沒到」。 */
function build(r){
  var ci=colorIndex(r.units),live=[];
  // r.units 已由後端依未報到比例排好序，這裡不重排，照收即可
  r.units.forEach(function(u){
    var left=[];
    u.cells.forEach(function(c,i){ if(!c.a)left.push({k:u.name+'#'+i,n:c.n}); });
    if(left.length)live.push({k:u.name,name:u.name,total:u.total,left:left,
                              col:unitColor(ci[u.name]),light:unitStep(ci[u.name])});
  });
  return live;
}

function layout(live){
  var stage=document.getElementById('stage'),wallbox=document.getElementById('wallbox'),
      wall=document.getElementById('wall'),legend=document.getElementById('legend');
  var headerH=document.querySelector('header').getBoundingClientRect().height;
  stage.style.setProperty('--pad-top',Math.ceil(headerH)+10+'px');

  // 左清單：單位名＋剩幾人，順序與牆上的色塊流向完全一致。
  // 寬度＝畫面的 1/3（2026-08-18 使用者指定：左 1/3 清單、右 2/3 牆）。
  // 手機也維持在左邊，只是比例收窄到 38%——再窄下去四個字的單位名就要被截斷。
  var narrow=(innerWidth/innerHeight)<0.8;
  var legw=Math.round(innerWidth*(narrow?0.38:1/3));
  var beforeL=snap(legend);
  stage.style.setProperty('--legw',legw+'px');
  /* 字級由三件事一起決定，少算一件就會出事：
     ① 最長單位名要放得下——只用欄寬的固定比例算，手機上「經營企劃管理室」
        會被截成一半（2026-08-18 實測：需要 133px 只拿到 68px）。
        分母＝名字字數 ＋ 人數欄 3.2em ＋ 間隔 0.5em ＋ 餘裕。
     ② 單位多的時候以高度為準，否則清單會長到超出畫面、後幾個單位直接看不見。
     ③ 1/3 的欄位配舊的 15px 會空得像沒東西，投在大螢幕上也讀不到，所以上限放到 44。 */
  var maxLen=live.reduce(function(m,u){return Math.max(m,u.name.length);},3);
  var fs=Math.max(11,Math.min(44,Math.floor(Math.min(
    legw/(maxLen+3.9), (innerHeight-headerH)/Math.max(live.length,1)*0.42))));
  legend.style.setProperty('--legfs',fs+'px');
  legend.style.setProperty('--leggap',Math.round(fs*0.55)+'px');
  reconcile(legend,live,makeLg,updLg);
  flip(legend,beforeL,26);   // 清單項目少，間隔可以大一點，看得出來是一個一個換位

  // 牆：把所有「還沒到」的人攤平，依單位順序排——同單位會聚成一片色塊
  var flat=[];
  live.forEach(function(u){ u.left.forEach(function(c){
    flat.push({k:c.k,n:c.n,col:u.col,light:u.light}); }); });

  var beforeW=snap(wall);
  var bw=wallbox.clientWidth, bh=wallbox.clientHeight;
  var cols=bestCols(flat.length,bw,bh);
  var rows=Math.ceil(flat.length/cols);
  // 間距的唯一來源是 CSS 的 --gap。在這裡再寫一次數字，改了一邊就會算錯格子邊長
  var gap=parseFloat(getComputedStyle(wall).gap)||6;
  // ⚠️ 上限 64px 是關鍵：早期 137 格會被縮到剛好填滿，後期格數少了就撞到上限、
  //    整塊跟著縮小——「越來越少」這件事才看得出來。不設上限的話格子會一路放大，
  //    畫面永遠是滿的，人數在減少完全感覺不到。
  var cs=Math.max(8,Math.floor(Math.min(
    (bw-gap*(cols-1))/cols, (bh-gap*(rows-1))/rows, 64)));
  wall.style.gridTemplateColumns='repeat('+cols+',var(--cs))';
  wall.style.setProperty('--cs',cs+'px');
  wall.style.setProperty('--nmfs',Math.max(8,Math.floor(cs*0.30))+'px');
  reconcile(wall,flat,makeCell,updCell);
  flip(wall,beforeW,4);      // 格子多，間隔要小，否則最後一格要等好幾秒才動
}

var outTimer=null;
function render(r){
  document.getElementById('act').textContent=r.actName||'';
  document.getElementById('nArrived').textContent=r.arrived;
  document.getElementById('nLeft').textContent=r.notArrived;
  document.getElementById('nTotal').textContent=r.total;

  var live=build(r);
  // 兩段：先讓報到的格子淡出（看得到「誰到了」），再重排剩下的（看得到「整體在移動」）。
  // 同時做的話兩件事會疊在一起，兩件都看不清楚。
  var keepC={},keepL={},outs=[];
  live.forEach(function(u){ keepL[u.k]=1; u.left.forEach(function(c){ keepC[c.k]=1; }); });
  markOut(document.getElementById('wall'),keepC,outs);
  markOut(document.getElementById('legend'),keepL,outs);

  clearTimeout(outTimer);
  if(outs.length&&!reduced())outTimer=setTimeout(function(){layout(live);},400);
  else layout(live);
}

var last=null,failures=0;
function tick(){
  jsonp('getArrivalWall',{token:q('t'),actId:q('act')}).then(function(r){
    if(!r||!r.ok){ showErr((r&&r.msg)||'讀取失敗'); return; }
    failures=0; showErr(''); last=r; render(r);
  }).catch(function(){
    failures++;
    // 有畫面就留著舊的——寧可看到 15 秒前的數字，也不要整片變成錯誤訊息
    showErr('連線不穩（'+failures+' 次），畫面停在上一次');
  });
}
// 錯誤才出現，正常時畫面只有四個資訊（活動名／已報到／未報到／總人數）
function showErr(t){
  var el=document.getElementById('msg');
  el.textContent=t; el.style.display=t?'block':'none';
}
tick();
setInterval(tick,15000);
// 旋轉或切換投影輸出時要重排格子，否則會溢出或縮成一小塊
var rz;
addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){
  if(last)render(last);},250);});
</script>
</body></html>
