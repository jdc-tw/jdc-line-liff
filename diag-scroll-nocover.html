<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfbfa">
<title>捲動實驗（無 cover）</title>
<style>
  /* ⚠️ 一次性實驗頁（2026-08-23）。量完就刪。
     為何存在：狀態列穿透改了三次都沒好，而剩下的兩個變因要組合起來試——
     一次試一個要來回四趟，全部擺在同一頁點兩下就試完。

     實測前提（使用者的 iPhone 16 Pro / iOS 26.6.1 / standalone）：
       env(safe-area-inset-top) = 0px   ← WebKit bug 301994
       env(safe-area-inset-bottom) = 34px
       screen 402×874 / innerHeight 812 ⇒ 狀態列佔 62px，且**不在可視區內**
     所以 fixed 的 top:0 是在狀態列下方，CSS 碰不到那 62px。
     muffinman.io 2026-08 的更新也說「viewport 外的 fixed 遮罩不再被繪製」。 */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Noto Sans TC", sans-serif;
    background: #fbfbfa; color: #2c2c2b;
  }
  /* ⚠️ 判讀用的顏色要鋪滿**整個捲動區**，不能只放一條橫幅。
     2026-08-23 第一版就是只放一條，使用者四種組合全回「沒穿透」——
     但那不是四種都有效，是**那一條只在捲過狀態列那 62px 的瞬間才可見**，
     其餘填充列跟底色同色、穿透了也看不出來。
     messages.html 看得出來是因為它的卡片是白的、與底色不同，整片內容都是證據。
     所以這裡把每一列都塗成桃紅：只要穿透，狀態列後面一定會有顏色。 */
  .flag {
    background: #d81b60; color: #fff; font-weight: 700; font-size: 15px;
    padding: 14px 16px; line-height: 1.5;
  }
  .bar {
    position: sticky; top: 0; z-index: 30; background: #fbfbfa;
    border-bottom: 1px solid #ececea; padding: 12px 16px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .lnk {
    font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 6px;
    border: 1px solid #c9c9c5; background: #fff; color: #2c2c2b;
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  button.on { background: #2f4858; color: #fff; border-color: #2f4858; }
  .now {
    font-size: 14px; color: #2c2c2b; background: #eef3f6;
    padding: 10px 16px; line-height: 1.6; border-bottom: 1px solid #ececea;
  }
  .now b { font-size: 15px; }
  .row {
    padding: 13px 16px; font-size: 15px;
    background: #d81b60; color: #fff; border-bottom: 1px solid #f06292;
  }
  .row:nth-child(even) { background: #ad1457; }

  /* ⚠️ 第二輪（2026-08-23）：四種組合都不穿透 ⇒ 成因不在 cover、也不在 body/容器捲動。
     那就在 messages.html 特有的東西上。這頁現在是**乾淨基準**，
     逐一加入下面三個特徵，第一個讓它開始穿透的就是元凶。

     最可疑的是 A 與 B——它們都是我自己為了「遮住狀態列」加上去的。
     muffinman.io 描述的機制是「viewport 外的繪製會被頁面內容揭露出來」，
     若屬實，那我加的遮罩可能反而是讓 Safari 開始繪製那一帶的觸發器。 */
  /* A：messages.html 標題列上那個巨大陰影 */
  body.fx-shadow .bar { box-shadow: 0 -50vmax 0 50vmax #fbfbfa; }
  /* B：負向定位、伸到 viewport 之外的 fixed 遮罩（就是 messages 的 .topmask） */
  #tm { display: none; }
  body.fx-mask #tm {
    display: block; position: fixed; top: -62px; left: 0; right: 0;
    height: 124px; background: #fbfbfa; z-index: 32;
  }
  /* C：畫面上另外有 fixed 元素（messages 的滑桿與 logo） */
  #fx { display: none; }
  body.fx-fixed #fx {
    display: block; position: fixed; left: 6px; top: 50%; transform: translateY(-50%);
    z-index: 20; font-size: 11px; color: #9a9a96; line-height: 2;
  }

  /* ── 模式二：捲動發生在內部容器，body 不捲 ──
     推論：body 捲動時 Safari 把整份文件的圖層畫到可視區之外（也就是狀態列那 62px）；
     改成內部容器捲動的話，那個容器有明確邊界，內容不該溢出。**待實測驗證。** */
  body.inner, html.inner { height: 100%; overflow: hidden; }
  body.inner #scroller { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body:not(.inner) #scroller { height: auto; overflow: visible; }
</style>
</head>
<body>
<div id="tm"></div>
<div id="fx">2026<br>08<br>23<br>21<br>20</div>
<div id="scroller">
  <div class="bar">
    <h1>捲動實驗（無 cover）</h1>
    <div class="btns">
      <button id="b1" type="button">body 捲動</button>
      <button id="b2" type="button">容器捲動</button>
      <a class="lnk" href="diag-scroll.html">← 切回「有 cover」版</a>
    </div>
    <div class="btns" style="margin-top:8px">
      <button id="fa" type="button">A 巨大陰影</button>
      <button id="fb" type="button">B 負向遮罩</button>
      <button id="fc" type="button">C 其他 fixed</button>
    </div>
  </div>
  <div class="now" id="now"></div>
  <div class="flag">↓ 底下整片都是桃紅色。往上捲，<b>狀態列後面只要看到桃紅就是還會穿透</b>；維持灰白就是這個組合有效。</div>
  <div id="fill"></div>
</div>
<script>
(function () {
  var mq = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  function px(n) {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;height:env(' + n + ',0px)';
    document.body.appendChild(d);
    var v = getComputedStyle(d).height;
    d.parentNode.removeChild(d);
    return v;
  }
  function paint() {
    var inner = document.body.classList.contains('inner');
    document.getElementById('now').innerHTML =
      '目前組合：<b>沒有 viewport-fit ＋ ' + (inner ? '容器捲動' : 'body 捲動') + '</b><br>'
      + 'env top ' + px('safe-area-inset-top')
      + '　screen ' + screen.height + '　inner ' + window.innerHeight
      + '　差 ' + (screen.height - window.innerHeight)
      + '<br>' + (mq ? '✅ standalone（量對環境）' : '🔴 不是主畫面 App，這樣量不算數')
      + '<br>已開啟的特徵：<b>' + (['fx-shadow','fx-mask','fx-fixed']
          .filter(function (c) { return document.body.classList.contains(c); })
          .map(function (c) { return { 'fx-shadow':'A 巨大陰影','fx-mask':'B 負向遮罩','fx-fixed':'C 其他 fixed' }[c]; })
          .join('、') || '（都沒開，乾淨基準）') + '</b>';
    document.getElementById('b1').className = inner ? '' : 'on';
    document.getElementById('b2').className = inner ? 'on' : '';
    [['fa','fx-shadow'],['fb','fx-mask'],['fc','fx-fixed']].forEach(function (p) {
      document.getElementById(p[0]).className = document.body.classList.contains(p[1]) ? 'on' : '';
    });
  }
  function set(inner) {
    document.body.classList.toggle('inner', inner);
    document.documentElement.classList.toggle('inner', inner);
    document.getElementById('scroller').scrollTop = 0;
    window.scrollTo(0, 0);
    paint();
  }
  document.getElementById('b1').addEventListener('click', function () { set(false); });
  document.getElementById('b2').addEventListener('click', function () { set(true); });

  // 三個可疑特徵各自獨立開關——一次只開一個，才分得出是誰造成的
  [['fa','fx-shadow'],['fb','fx-mask'],['fc','fx-fixed']].forEach(function (pair) {
    document.getElementById(pair[0]).addEventListener('click', function () {
      document.body.classList.toggle(pair[1]);
      paint();
    });
  });

  var rows = '';
  for (var i = 1; i <= 40; i++) rows += '<div class="row">填充列 ' + i + '　狀態列後面有沒有桃紅色？</div>';
  document.getElementById('fill').innerHTML = rows;
  paint();
})();
</script>
</body>
</html>
