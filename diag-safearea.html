<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa">
<title>版面診斷</title>
<style>
  /* ⚠️ 這是一次性的診斷頁（2026-08-23 建）。
     為何存在：狀態列遮罩改了三次都沒修好，而我**從來沒有量過**
     `env(safe-area-inset-top)` 在使用者機器上的實際值——三次都是照推論改。
     WebKit bug 301994 說 iOS 26.1 起這個值會回 0，若真如此，
     那三次的遮罩高度全部是 0、等於不存在。
     這頁把數字放到眼前，量到之後就刪。刻意不連結到任何地方。
     ⚠️ 檔名不可以用底線開頭：**GitHub Pages 走 Jekyll，`_` 開頭的檔案會被整個忽略**，
        部署後回 404 而 CI 仍然全綠、零錯誤訊息（2026-08-23 實測踩到，
        原檔名 `_diag.html` 就是這樣消失的）。 */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Noto Sans TC", sans-serif;
    background: #fbfbfa; color: #2c2c2b; font-size: 17px; line-height: 1.7;
  }
  /* 這條紅帶的高度＝env(safe-area-inset-top)。**看得到紅色就代表這個值不是 0**，
     看不到就是 0——這一眼比任何數字都快。 */
  .band {
    position: fixed; top: 0; left: 0; right: 0; height: var(--sat);
    background: #c0392b; z-index: 50;
  }
  .wrap { padding: calc(24px + var(--sat)) 20px calc(24px + var(--sab)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #6b6b68; font-size: 14px; margin: 0 0 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #ececea; vertical-align: top; }
  th { color: #6b6b68; font-weight: 400; width: 46%; }
  td { font-family: ui-monospace, Menlo, monospace; font-size: 15px; word-break: break-all; }
  .big td { font-size: 19px; font-weight: 700; }
  .big.zero td { color: #c0392b; }
  .big.ok td { color: #2e7d4f; }
  h2 { font-size: 15px; color: #6b6b68; font-weight: 600; margin: 22px 0 6px; }
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <h1>版面診斷</h1>
  <p class="hint">整頁截圖給我就好。最上面那條<strong>紅帶</strong>的高度就是安全區——
    看不到紅色代表它是 0，那就是問題所在。</p>
  <table id="t"></table>
</div>
<script>
(function () {
  function px(name) {
    // env() 沒辦法直接讀，塞進一個離屏元素量它的高度
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;height:env(' + name + ',0px)';
    document.body.appendChild(d);
    var v = getComputedStyle(d).height;
    d.parentNode.removeChild(d);
    return v;
  }
  var rows = [];
  function add(k, v, cls) { rows.push([k, v, cls || '']); }
  function sec(title) { rows.push(['##', title, '']); }

  var top = px('safe-area-inset-top');
  var isZero = parseFloat(top) === 0;
  sec('關鍵數字');
  add('env(safe-area-inset-top)', top, 'big ' + (isZero ? 'zero' : 'ok'));
  add('env(safe-area-inset-bottom)', px('safe-area-inset-bottom'));
  add('env(safe-area-inset-left)', px('safe-area-inset-left'));
  add('env(safe-area-inset-right)', px('safe-area-inset-right'));

  sec('是不是 standalone');
  add('navigator.standalone', String(window.navigator.standalone));
  add('display-mode: standalone',
      String(window.matchMedia('(display-mode: standalone)').matches));
  add('display-mode: fullscreen',
      String(window.matchMedia('(display-mode: fullscreen)').matches));

  sec('視窗尺寸');
  add('screen', screen.width + ' × ' + screen.height);
  add('window.inner', window.innerWidth + ' × ' + window.innerHeight);
  add('documentElement.client',
      document.documentElement.clientWidth + ' × ' + document.documentElement.clientHeight);
  if (window.visualViewport) {
    var vv = window.visualViewport;
    add('visualViewport', Math.round(vv.width) + ' × ' + Math.round(vv.height));
    add('visualViewport.offsetTop', String(Math.round(vv.offsetTop)));
    add('visualViewport.pageTop', String(Math.round(vv.pageTop)));
  } else {
    add('visualViewport', '（不支援）');
  }
  add('screen.height − innerHeight', String(screen.height - window.innerHeight));
  add('devicePixelRatio', String(window.devicePixelRatio));

  sec('這一頁自己的 meta');
  var mv = document.querySelector('meta[name=viewport]');
  add('viewport', mv ? mv.content : '（無）');
  var mt = document.querySelector('meta[name=theme-color]');
  add('theme-color', mt ? mt.content : '（無）');
  var sb = document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
  add('status-bar-style', sb ? sb.content : '（無，這一頁刻意沒設）');

  sec('系統');
  add('userAgent', navigator.userAgent);
  // 一眼判斷這份數字量對環境沒有——CriOS＝Chrome for iOS 的一般分頁，不是主畫面 App
  var ua = navigator.userAgent;
  var kind = /CriOS/.test(ua) ? '🔴 Chrome for iOS（不是 App，這份數字不算數）'
           : /FxiOS/.test(ua) ? '🔴 Firefox for iOS（同上）'
           : /Line\//.test(ua) ? '🔴 LINE 內建瀏覽器（同上）'
           : (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches)
             ? '✅ 主畫面 App（standalone）——這才是要量的環境'
             : '🔴 Safari 一般分頁（不是 App，這份數字不算數）';
  add('量對環境了嗎', kind, 'big');

  var html = rows.map(function (r) {
    if (r[0] === '##') return '<tr><td colspan="2"><h2>' + r[1] + '</h2></td></tr>';
    return '<tr class="' + r[2] + '"><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>';
  }).join('');
  document.getElementById('t').innerHTML = html;
})();
</script>
</body>
</html>
